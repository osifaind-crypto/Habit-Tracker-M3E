  <style>
    /* Material 3 Surface & Color System Variables */
    :root {
      --m3-surface-dim: #0b0e14;
      --m3-surface-container-low: #121620;
      --m3-surface-container: #1a1f2c;
      --m3-surface-container-high: #222838;
      --m3-surface-container-highest: #2c3346;
      --m3-primary: #80d4ff;
      --m3-secondary: #a7c7e7;
      --m3-tertiary: #c084fc;
      --m3-border: rgba(255, 255, 255, 0.08);
      --m3-primary-overlay: rgba(128, 212, 255, 0.12);
    }

    /* 1. Base Surface (Canvas: #0b0e14) & Ambient Glows */
    body {
      background-color: #0b0e14;
      background-image: 
        radial-gradient(circle at 50% -10%, rgba(128, 212, 255, 0.22) 0%, transparent 50%),
        radial-gradient(circle at 100% 60%, rgba(192, 132, 252, 0.14) 0%, transparent 40%),
        radial-gradient(circle at 0% 90%, rgba(167, 199, 231, 0.16) 0%, transparent 45%);
      background-attachment: fixed;
      color: #e2e8f0;
      font-family: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif;
      overflow-x: hidden;
    }

    /* 2. Tonal Elevation Hierarchy & Rim Lighting */
    .m3-surface-low {
      background-color: var(--m3-surface-container-low);
      border: 1px solid var(--m3-border);
    }

    .m3-surface-container, .gemini-card {
      background-color: var(--m3-surface-container);
      backdrop-filter: blur(24px) saturate(180%);
      -webkit-backdrop-filter: blur(24px) saturate(180%);
      border: 1px solid var(--m3-border);
      box-shadow: 
        0 20px 40px -15px rgba(0, 0, 0, 0.7),
        inset 0 1px 0 0 rgba(255, 255, 255, 0.12);
      border-radius: 32px;
      transition: all 0.3s cubic-bezier(0.2, 0.0, 0.0, 1.0);
    }

    .m3-surface-container:hover, .gemini-card:hover {
      background-color: var(--m3-surface-container-high);
      border-color: rgba(128, 212, 255, 0.35);
      box-shadow: 
        0 24px 48px -12px rgba(0, 0, 0, 0.8),
        0 0 24px rgba(128, 212, 255, 0.15),
        inset 0 1px 0 0 rgba(255, 255, 255, 0.2);
    }

    /* Material 3 Card Press Spring Effect */
    .m3-surface-container:active, .gemini-card:active, .m3-card-press:active {
      transform: scale(0.98);
      transition: transform 0.3s cubic-bezier(0.2, 0.0, 0.0, 1.0);
    }

    /* Habit Completion Toggle Morphing Button (rounded-2xl -> rounded-full) */
    .m3-completion-toggle {
      border-radius: 16px;
      transition: all 0.3s cubic-bezier(0.2, 0.0, 0.0, 1.0);
    }
    .m3-completion-toggle.is-checked {
      border-radius: 9999px;
      background: linear-gradient(135deg, #80d4ff 0%, #00b4d8 100%);
      box-shadow: 0 0 16px rgba(128, 212, 255, 0.4);
    }

    /* FAB Primary Action Expand Micro-interaction */
    .m3-fab-expand {
      border-radius: 9999px;
      transition: all 0.3s cubic-bezier(0.2, 0.0, 0.0, 1.0);
    }

    .m3-surface-highest {
      background-color: var(--m3-surface-container-highest);
      border: 1px solid var(--m3-border);
      box-shadow: 0 24px 48px rgba(0, 0, 0, 0.8);
    }

    /* Active Cards with Subtle Primary Tint Overlay */
    .m3-active-card, .gemini-glow-active {
      background: linear-gradient(135deg, rgba(128, 212, 255, 0.12) 0%, rgba(26, 31, 44, 0.95) 100%);
      border: 1px solid rgba(128, 212, 255, 0.45);
      box-shadow: 0 0 20px rgba(128, 212, 255, 0.25);
    }

    /* Floating Pill Containers */
    .gemini-pill, .gemini-pill-nav {
      background: rgba(26, 31, 44, 0.9);
      backdrop-filter: blur(30px);
      -webkit-backdrop-filter: blur(30px);
      border: 1px solid rgba(128, 212, 255, 0.2);
      box-shadow: 
        0 12px 32px rgba(0, 0, 0, 0.6),
        0 0 20px rgba(128, 212, 255, 0.15),
        inset 0 1px 1px rgba(255, 255, 255, 0.2);
      border-radius: 9999px;
    }

    ::-webkit-scrollbar {
      width: 6px;
      height: 6px;
    }
    ::-webkit-scrollbar-track {
      background: transparent;
    }
    ::-webkit-scrollbar-thumb {
      background: rgba(128, 212, 255, 0.2);
      border-radius: 9999px;
    }
    ::-webkit-scrollbar-thumb:hover {
      background: rgba(128, 212, 255, 0.4);
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .animate-fade-in {
      animation: fadeIn 0.3s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }

    @keyframes geminiGlow {
      0%, 100% { opacity: 0.55; transform: translate(-50%, 0) scale(1) rotate(0deg); }
      33% { opacity: 0.8; transform: translate(-45%, 15px) scale(1.08) rotate(4deg); }
      66% { opacity: 0.65; transform: translate(-55%, -15px) scale(0.95) rotate(-4deg); }
    }
    .animate-gemini-glow {
      animation: geminiGlow 14s cubic-bezier(0.4, 0, 0.2, 1) infinite;
    }

    @keyframes geminiShimmer {
      0% { background-position: -200% 0; }
      100% { background-position: 200% 0; }
    }
    .gemini-shimmer-text {
      background: linear-gradient(90deg, #00f2fe, #00d8ff, #8b5cf6, #ec4899, #00f2fe);
      background-size: 200% auto;
      color: transparent;
      -webkit-background-clip: text;
      background-clip: text;
      animation: geminiShimmer 6s linear infinite;
    }

    /* 2. Glassmorphism & Shimmer Cards */
    .gemini-card {
      background: rgba(12, 22, 30, 0.65);
      backdrop-filter: blur(24px) saturate(180%);
      -webkit-backdrop-filter: blur(24px) saturate(180%);
      border: 1px solid rgba(255, 255, 255, 0.08);
      box-shadow: 
        0 20px 40px -15px rgba(0, 0, 0, 0.7),
        inset 0 1px 0 0 rgba(255, 255, 255, 0.12);
      border-radius: 28px;
      transition: all 0.3s ease;
    }
    .gemini-card:hover {
      border-color: rgba(0, 242, 254, 0.35);
      box-shadow: 
        0 24px 48px -12px rgba(0, 0, 0, 0.8),
        0 0 24px rgba(0, 242, 254, 0.15),
        inset 0 1px 0 0 rgba(255, 255, 255, 0.2);
    }

    /* 3. The Iconic Gemini Floating Pill (Bottom Bar / Input) */
    .gemini-pill, .gemini-pill-nav {
      background: rgba(15, 28, 38, 0.85);
      backdrop-filter: blur(30px);
      -webkit-backdrop-filter: blur(30px);
      border: 1px solid rgba(0, 242, 254, 0.2);
      box-shadow: 
        0 12px 32px rgba(0, 0, 0, 0.6),
        0 0 20px rgba(0, 200, 255, 0.15),
        inset 0 1px 1px rgba(255, 255, 255, 0.2);
      border-radius: 9999px;
    }

    /* 4. Active Glow Buttons & State Indicators */
    .gemini-glow-active {
      background: linear-gradient(135deg, rgba(0, 242, 254, 0.2) 0%, rgba(0, 119, 182, 0.3) 100%);
      border: 1px solid rgba(0, 242, 254, 0.5);
      box-shadow: 0 0 15px rgba(0, 242, 254, 0.3);
    }

    /* 5. Custom Heatmap Glowing Cells */
    .heatmap-cell-active {
      background: #00f2fe;
      box-shadow: 0 0 10px rgba(0, 242, 254, 0.6);
    }

    /* Flame Flicker Animation for Hot Streaks (>3 days) */
    @keyframes flameFlicker {
      0% {
        transform: scale(1) rotate(0deg);
        filter: drop-shadow(0 0 3px rgba(245, 158, 11, 0.5));
        opacity: 0.95;
      }
      20% {
        transform: scale(1.12) rotate(-4deg);
        filter: drop-shadow(0 0 7px rgba(245, 158, 11, 0.85)) drop-shadow(0 0 10px rgba(239, 68, 68, 0.4));
        opacity: 1;
      }
      40% {
        transform: scale(0.96) rotate(3deg);
        filter: drop-shadow(0 0 4px rgba(245, 158, 11, 0.6));
        opacity: 0.9;
      }
      60% {
        transform: scale(1.15) rotate(-2deg);
        filter: drop-shadow(0 0 8px rgba(251, 191, 36, 0.9)) drop-shadow(0 0 12px rgba(239, 68, 68, 0.5));
        opacity: 1;
      }
      80% {
        transform: scale(1.02) rotate(4deg);
        filter: drop-shadow(0 0 5px rgba(245, 158, 11, 0.7));
        opacity: 0.95;
      }
      100% {
        transform: scale(1) rotate(0deg);
        filter: drop-shadow(0 0 3px rgba(245, 158, 11, 0.5));
        opacity: 0.95;
      }
    }

    .animate-flame-flicker {
      animation: flameFlicker 1.8s ease-in-out infinite;
      transform-origin: bottom center;
    }

    /* Flame Particle Sparks Effect */
    @keyframes sparkRise1 {
      0% {
        transform: translate(0, 0) scale(0.6);
        opacity: 0;
      }
      30% {
        opacity: 0.9;
      }
      100% {
        transform: translate(-4px, -14px) scale(0.2);
        opacity: 0;
      }
    }

    @keyframes sparkRise2 {
      0% {
        transform: translate(0, 0) scale(0.5);
        opacity: 0;
      }
      40% {
        opacity: 0.85;
      }
      100% {
        transform: translate(5px, -16px) scale(0.15);
        opacity: 0;
      }
    }

    @keyframes sparkRise3 {
      0% {
        transform: translate(0, 0) scale(0.7);
        opacity: 0;
      }
      25% {
        opacity: 1;
      }
      100% {
        transform: translate(1px, -18px) scale(0.25);
        opacity: 0;
      }
    }

    .flame-spark-1 {
      animation: sparkRise1 1.4s ease-out infinite;
    }

    .flame-spark-2 {
      animation: sparkRise2 1.7s ease-out 0.4s infinite;
    }

    .flame-spark-3 {
      animation: sparkRise3 1.5s ease-out 0.8s infinite;
    }
  </style>
</head>

    // --- Date Utilities ---
    function getTodayStr() {
      const now = new Date();
      return `${now.getFullYear()}-${String(now.getMonth() + 1).padStart(2, '0')}-${String(now.getDate()).padStart(2, '0')}`;
    }

    function isCompletedToday(habitId, completions) {
      const today = getTodayStr();
      return completions.some(c => c.habitId === habitId && c.date === today);
    }

    function calculateStreak(habitId, completions) {
      return getStreakStartDate(habitId, completions).streak;
    }

    function getStreakStartDate(habitId, completions) {
      const habitCompletions = new Set(
        completions.filter(c => c.habitId === habitId).map(c => c.date)
      );
      let streak = 0;
      let curr = new Date();
      let dateStr = getTodayStr();

      if (!habitCompletions.has(dateStr)) {
        curr.setDate(curr.getDate() - 1);
        dateStr = `${curr.getFullYear()}-${String(curr.getMonth() + 1).padStart(2, '0')}-${String(curr.getDate()).padStart(2, '0')}`;
      }

      let startDate = null;
      while (habitCompletions.has(dateStr)) {
        streak++;
        startDate = new Date(curr);
        curr.setDate(curr.getDate() - 1);
        dateStr = `${curr.getFullYear()}-${String(curr.getMonth() + 1).padStart(2, '0')}-${String(curr.getDate()).padStart(2, '0')}`;
      }

      let formattedStartDate = null;
      if (startDate) {
        const months = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
        formattedStartDate = `${months[startDate.getMonth()]} ${startDate.getDate()}, ${startDate.getFullYear()}`;
      }

      return { streak, startDate, formattedStartDate };
    }

    function calculateConsistencyScore(habit, completions) {
      const habitCompletions = completions.filter(c => c.habitId === habit.id);
      const uniqueCompletionDays = new Set(habitCompletions.map(c => c.date)).size;

      const today = new Date();
      const createdDate = habit.createdAt ? new Date(habit.createdAt) : today;

      const startMs = new Date(createdDate.getFullYear(), createdDate.getMonth(), createdDate.getDate()).getTime();
      const todayMs = new Date(today.getFullYear(), today.getMonth(), today.getDate()).getTime();

      const totalDays = Math.max(1, Math.floor((todayMs - startMs) / (1000 * 60 * 60 * 24)) + 1);
      return Math.min(100, Math.round((uniqueCompletionDays / totalDays) * 100));
    }

    function getWeeklyHistory(completions) {
      const days = [];
      const today = new Date();
      const currentDayOfWeek = today.getDay();
      const distanceToMonday = currentDayOfWeek === 0 ? 6 : currentDayOfWeek - 1;
      
      const monday = new Date(today);
      monday.setDate(today.getDate() - distanceToMonday);

      for (let i = 0; i < 7; i++) {
        const d = new Date(monday);
        d.setDate(monday.getDate() + i);
        const dateStr = `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
        const completedHabits = completions.filter(c => c.date === dateStr);
        days.push({ date: d, dateStr, completedHabits });
      }
      return days;
    }

    ];

    class CategoryManager {
      static getCategories() {
        try {
          const stored = localStorage.getItem('habit-tracker-custom-categories');
          if (stored) {
            return [...DEFAULT_CATEGORIES, ...JSON.parse(stored)];
          }
        } catch (e) {}
        return DEFAULT_CATEGORIES;
      }

      static addCategory(category) {
        const categories = this.getCategories();
        const newCat = {
          ...category,
          id: category.name.toLowerCase().replace(/\s+/g, '-'),
        };
        const existing = categories.find(c => c.name.toLowerCase() === newCat.name.toLowerCase());
        if (existing) return existing;

        const customOnly = categories.filter(c => !DEFAULT_CATEGORIES.some(d => d.id === c.id));
        customOnly.push(newCat);
        localStorage.setItem('habit-tracker-custom-categories', JSON.stringify(customOnly));
        return newCat;
      }

      static getCategoryByName(name) {
        const categories = this.getCategories();
        return categories.find(c => c.name.toLowerCase() === (name || '').toLowerCase()) || {
          id: 'other',
          name: name || 'General',
          icon: '',
          color: '#00f2fe',
        };
      }
    }

    // --- Components ---

    // Progress Ring Component (Multi-color Shimmering Gemini Ring)
    function ProgressRing({ progress, size = 140, strokeWidth = 12 }) {
      const radius = (size - strokeWidth) / 2;
      const circumference = radius * 2 * Math.PI;
      const clampedProgress = Math.min(1, Math.max(0, progress));
      const offset = circumference - clampedProgress * circumference;
      const isComplete = clampedProgress === 1;

      return (
        <div 
          className={`relative flex items-center justify-center flex-shrink-0 transition-all duration-500 ${
            isComplete ? 'animate-pulse scale-[1.05]' : ''
          }`} 
          style={{ width: size, height: size }}
        >
          {/* Glowing Ambient Backdrop Aura */}
          <div className={`absolute inset-0 rounded-full blur-xl transition-all duration-700 pointer-events-none ${
            isComplete ? 'bg-[#00f2fe]/35 scale-110 animate-pulse' : 'bg-[#00f2fe]/10'
          }`} />

          <svg className="transform -rotate-90 w-full h-full overflow-visible relative z-10">
            <defs>
              <linearGradient id="geminiRingGrad" x1="0%" y1="0%" x2="100%" y2="100%">
                <stop offset="0%" stopColor="#00f2fe" />
                <stop offset="30%" stopColor="#00d8ff" />
                <stop offset="65%" stopColor="#8b5cf6" />
                <stop offset="100%" stopColor="#ec4899" />
              </linearGradient>
            </defs>
            <circle cx={size / 2} cy={size / 2} r={radius} fill="none" stroke="#001a2e" strokeWidth={strokeWidth} />
            <circle
              cx={size / 2}
              cy={size / 2}
              r={radius}
              fill="none"
              stroke="url(#geminiRingGrad)"
              strokeWidth={strokeWidth}
              strokeDasharray={circumference}
              strokeDashoffset={offset}
              strokeLinecap="round"
              className="transition-all duration-1000 ease-out"
              style={{
                transitionProperty: 'stroke-dashoffset',
                transitionDuration: '1.4s',
                transitionTimingFunction: 'cubic-bezier(0.16, 1, 0.3, 1)',
                filter: 'drop-shadow(0px 0px 8px rgba(0, 242, 254, 0.6))'
              }}
            />
          </svg>

          <div className="absolute flex flex-col items-center justify-center text-center animate-fade-in z-10">
            <span className="text-3xl font-extrabold tracking-tighter text-[#00f2fe] drop-shadow-[0_0_12px_rgba(0,242,254,0.4)]">
              {Math.round(clampedProgress * 100)}%
            </span>
            <div className="flex items-center gap-1 mt-0.5">
              <IconGeminiStar className="w-3.5 h-3.5 text-[#00f2fe] animate-pulse" />
              <span className="text-[10px] uppercase font-bold tracking-widest text-teal-300/80">Daily</span>
            </div>
          </div>
        </div>
      );
    }

    // Monthly Heatmap Component (Dynamic Teal-to-Cyan Glowing Scale)
    function MonthlyHeatmap({ habits, completions, onSelectDate }) {
      const [currentMonth, setCurrentMonth] = useState(new Date());
      const [hoveredDate, setHoveredDate] = useState(null);

      const year = currentMonth.getFullYear();
      const month = currentMonth.getMonth();

      const firstDayOfMonth = new Date(year, month, 1);
      const lastDayOfMonth = new Date(year, month + 1, 0);

      let startDayOfWeek = firstDayOfMonth.getDay() - 1;
      if (startDayOfWeek === -1) startDayOfWeek = 6;

      const daysInGrid = [];

      const prevMonthLastDay = new Date(year, month, 0).getDate();
      for (let i = startDayOfWeek - 1; i >= 0; i--) {
        const d = new Date(year, month - 1, prevMonthLastDay - i);
        daysInGrid.push({ date: d, isCurrentMonth: false });
      }

      for (let d = 1; d <= lastDayOfMonth.getDate(); d++) {
        const dateObj = new Date(year, month, d);
        daysInGrid.push({ date: dateObj, isCurrentMonth: true });
      }

      const remaining = 7 - (daysInGrid.length % 7);
      if (remaining < 7) {
        for (let i = 1; i <= remaining; i++) {
          const d = new Date(year, month + 1, i);
          daysInGrid.push({ date: d, isCurrentMonth: false });
        }
      }

      const dayNames = ['Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat', 'Sun'];
      const monthNames = ['January', 'February', 'March', 'April', 'May', 'June', 'July', 'August', 'September', 'October', 'November', 'December'];

      const todayStr = getTodayStr();

      const handlePrev = () => setCurrentMonth(new Date(year, month - 1, 1));
      const handleNext = () => setCurrentMonth(new Date(year, month + 1, 1));
      const handleToday = () => setCurrentMonth(new Date());

                <svg className="w-5 h-5" fill="none" stroke="currentColor" strokeWidth="2" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" d="M6.75 3v2.25M17.25 3v2.25M3 18.75V7.5a2.25 2.25 0 0 1 2.25-2.25h13.5A2.25 2.25 0 0 1 21 7.5v11.25m-18 0A2.25 2.25 0 0 0 5.25 21h13.5A2.25 2.25 0 0 0 21 18.75m-18 0v-7.5A2.25 2.25 0 0 1 5.25 9h13.5A2.25 2.25 0 0 1 21 11.25v7.5"/></svg>
              </div>
              <div>
                <h3 className="text-white font-bold text-base sm:text-lg flex items-center gap-2">
                  Heatmap Calendar
                  <IconGeminiStar className="w-4 h-4 text-[#00f2fe]" />

                <p className="text-teal-200/60 text-xs">Click cell to backdate or view historical completions</p>

            <div className="flex items-center gap-2">
              <button onClick={handlePrev} className="p-2 rounded-xl bg-[#001729] hover:bg-[#002845] text-teal-200 hover:text-white transition-all active:scale-95 border border-[#00f2fe]/15" title="Previous Month">
                ◀
              </button>
              <span className="text-sm font-bold text-white min-w-[120px] text-center px-2">
                {monthNames[month]} {year}
              </span>
              <button onClick={handleNext} className="p-2 rounded-xl bg-[#001729] hover:bg-[#002845] text-teal-200 hover:text-white transition-all active:scale-95 border border-[#00f2fe]/15" title="Next Month">
                ▶
              </button>
              <button onClick={handleToday} className="px-3.5 py-1.5 text-xs font-bold rounded-xl bg-[#00f2fe]/15 text-[#00f2fe] hover:bg-[#00f2fe]/25 transition-all border border-[#00f2fe]/30 shadow-[0_0_12px_rgba(0,242,254,0.15)]">
                Today
              </button>
            </div>
          </div>

          <div className="grid grid-cols-7 gap-1.5 sm:gap-2 text-center mb-2">

              <div key={day} className="text-xs font-bold text-teal-300/70 py-1 uppercase tracking-wider">{day}</div>
            ))}
          </div>

          <div className="grid grid-cols-7 gap-1.5 sm:gap-2">
            {daysInGrid.map(({ date, isCurrentMonth }, idx) => {
              const y = date.getFullYear();
              const m = String(date.getMonth() + 1).padStart(2, '0');
              const d = String(date.getDate()).padStart(2, '0');
              const dateStr = `${y}-${m}-${d}`;

              const isTodayCell = dateStr === todayStr;
              const dayCompletions = completions.filter(c => c.date === dateStr);
              const completedCount = habits.filter(h => dayCompletions.some(c => c.habitId === h.id)).length;
              const totalHabits = habits.length;
              const percentage = totalHabits === 0 ? 0 : completedCount / totalHabits;

              let cellStyle = "bg-[#001220]/40 text-teal-900/40 border-transparent opacity-40";
              if (isCurrentMonth) {
                if (percentage === 0) {
                  cellStyle = "bg-[#001729] text-teal-200/50 border-[#00f2fe]/10 hover:border-[#00f2fe]/40";
                } else if (percentage < 0.35) {
                  cellStyle = "bg-[#003859] text-cyan-200 border-[#00f2fe]/30 hover:bg-[#004870]";

                  >
                    <span className={`text-xs sm:text-sm font-semibold ${isTodayCell ? 'underline font-extrabold text-[#00f2fe]' : ''}`}>
                      {date.getDate()}
                    </span>
                    {isCurrentMonth && habits.length > 0 && (
                      <div className="flex items-center justify-center">
                        {completedCount > 0 ? (
                          <span className="text-[10px] font-extrabold">{completedCount}/{totalHabits}</span>

                          <span className="w-1.5 h-1.5 rounded-full bg-white/15" />

                    )}
                  </button>

                  {hoveredDate === dateStr && isCurrentMonth && (
                    <div className="absolute bottom-full left-1/2 -translate-x-1/2 mb-2 z-30 pointer-events-none w-48 bg-[#001c30] text-white p-3 rounded-2xl shadow-2xl border border-[#00f2fe]/30 text-xs space-y-1.5 animate-fade-in backdrop-blur-md">

              );

          </div>

          <div className="mt-6 pt-4 border-t border-[#00f2fe]/15 flex flex-wrap items-center justify-between gap-3 text-xs text-teal-200/60">

              <div className="flex items-center gap-1.5">

                <span className="w-3.5 h-3.5 rounded-md bg-gradient-to-tr from-[#00f2fe] to-[#8b5cf6] shadow-[0_0_10px_rgba(0,242,254,0.6)]" title="100%" />
              </div>
            </div>

            <button
              onClick={() => onSelectDate && onSelectDate(todayStr)}
              className="text-[#00f2fe] font-bold hover:underline flex items-center gap-1.5 active:scale-95 transition-transform"
            >
              + Backdate Past Habit
            </button>
          </div>
        </div>
      );
    }

    // Weekly Heatmap Component
    function WeeklyHeatmap({ completions, habits, onSelectDate }) {
      const weekData = getWeeklyHistory(completions);
      const todayStr = getTodayStr();

      return (
        <div className="gemini-card rounded-3xl p-6 border border-[#00f2fe]/20">
          <div className="flex items-center justify-between mb-6">
            <h3 className="text-white font-bold text-base flex items-center gap-2">
              This Week's Velocity
              <IconGeminiStar className="w-4 h-4 text-[#00f2fe]" />
            </h3>
            <span className="text-xs text-teal-200/60">Click day to backdate</span>
          </div>
          <div className="flex justify-between items-end h-32 gap-2">
            {weekData.map((day) => {
              const isToday = day.dateStr === todayStr;
              const totalHabits = habits.length || 1;
              const completedCount = day.completedHabits.length;
              const percentage = completedCount / totalHabits;

              let bgClass = 'bg-[#001729]';
              if (percentage > 0) bgClass = 'bg-[#003859] border border-[#00f2fe]/20';
              if (percentage >= 0.5) bgClass = 'bg-[#006090] border border-[#00f2fe]/40';
              if (percentage >= 1) bgClass = 'bg-gradient-to-t from-[#00f2fe] to-[#00a8ff] shadow-[0_0_20px_rgba(0,242,254,0.5)]';

              const dayName = day.date.toLocaleDateString('en-US', { weekday: 'short' }).charAt(0);

              return (
                <div key={day.dateStr} onClick={() => onSelectDate && onSelectDate(day.dateStr)} className="flex flex-col items-center flex-1 gap-3 cursor-pointer group">
                  <div
                    className={`w-full max-w-[2rem] rounded-full transition-all duration-300 relative flex items-end group-hover:scale-105 ${bgClass}`}
                    style={{ height: '100%', minHeight: '12px', border: isToday ? '2px solid #00f2fe' : undefined }}
                  >
                    <div
                      className="w-full bg-[#00f2fe]/30 rounded-full transition-all duration-500 absolute bottom-0"
                      style={{ height: `${percentage * 100}%` }}
                    />
                  </div>
                  <span className={`text-xs font-bold ${isToday ? 'text-[#00f2fe]' : 'text-teal-200/50'}`}>
                    {dayName}
                  </span>
                </div>
              );
            })}
          </div>
        </div>
      );
    }

    // Milestone Badges Component
    function MilestoneBadges({ habits, completions }) {
      const [selectedMilestone, setSelectedMilestone] = useState(null);

      const habitStreaks = habits.map(h => ({
        habit: h,
        streak: calculateStreak(h.id, completions),
      }));

      const maxStreak = habitStreaks.reduce((max, hs) => Math.max(max, hs.streak), 0);
      const unlockedDays = new Set();
      habitStreaks.forEach(hs => {
        MILESTONES.forEach(m => {
          if (hs.streak >= m.days) unlockedDays.add(m.days);
        });
      });

      return (
        <div className="gemini-card rounded-3xl p-6 border border-[#00f2fe]/20 shadow-xl relative">
          <div className="flex items-center justify-between mb-4">
            <div className="flex items-center gap-2.5">
              <div className="p-2.5 bg-[#00f2fe]/10 rounded-2xl text-[#00f2fe] border border-[#00f2fe]/20">
                <IconAward />
              </div>
              <div>
                <h3 className="text-white font-bold text-base flex items-center gap-2">
                  Streak Badges
                  <IconGeminiStar className="w-3.5 h-3.5 text-[#00f2fe]" />
                </h3>
                <p className="text-teal-200/60 text-xs">
                  {unlockedDays.size} of {MILESTONES.length} unlocked • Best Streak: {maxStreak}d
                </p>
              </div>
            </div>
          </div>

          <div className="grid grid-cols-3 sm:grid-cols-6 gap-3 pt-2">
            {MILESTONES.map(m => {
              const isUnlocked = unlockedDays.has(m.days);
              return (
                <button
                  key={m.days}
                  onClick={() => setSelectedMilestone(m)}
                  className={`flex flex-col items-center justify-center p-3 rounded-2xl border transition-all text-center relative focus:outline-none hover:scale-105 active:scale-95 ${
                    isUnlocked ? `${m.badgeBg} shadow-md` : 'bg-[#001424] border-white/5 text-teal-200/40 opacity-60'
                  }`}
                >
                  <div className={`w-10 h-10 rounded-xl flex items-center justify-center text-xl mb-1.5 relative ${isUnlocked ? 'bg-white/10' : 'bg-white/5'}`}>
                    <span>{m.icon}</span>
                    {!isUnlocked && (
                      <div className="absolute inset-0 bg-black/50 rounded-xl flex items-center justify-center backdrop-blur-[1px]">
                        <IconLock />
                      </div>
                    )}
                  </div>
                  <span className={`text-[11px] font-bold truncate w-full ${isUnlocked ? 'text-white' : 'text-teal-200/50'}`}>
                    {m.title}
                  </span>
                  <span className="text-[10px] text-teal-200/60 font-medium">{m.days} days</span>
                </button>
              );
            })}
          </div>

          {selectedMilestone && (
            <div className="fixed inset-0 z-50 flex items-center justify-center p-4">
              <div className="absolute inset-0 bg-[#000c14]/80 backdrop-blur-md" onClick={() => setSelectedMilestone(null)} />
              <div className="relative w-full max-w-xs bg-gradient-to-b from-[#00243f] to-[#000c14] rounded-3xl p-6 shadow-2xl border border-[#00f2fe]/30 text-center animate-fade-in z-10">
                <div className="w-16 h-16 mx-auto rounded-2xl flex items-center justify-center text-3xl mb-3 border shadow-lg" style={{ backgroundColor: `${selectedMilestone.color}25`, borderColor: `${selectedMilestone.color}50` }}>
                  {selectedMilestone.icon}
                </div>
                <h4 className="text-lg font-bold text-white mb-1">{selectedMilestone.title}</h4>
                <p className="text-xs text-[#00f2fe] font-semibold mb-3">{selectedMilestone.days}-Day Streak Milestone</p>
                <div className="text-xs text-teal-100 bg-[#001729] p-3.5 rounded-2xl mb-4 border border-[#00f2fe]/15">
                  {unlockedDays.has(selectedMilestone.days) ? (
                    <div>
                      <p className="text-[#00f2fe] font-bold">Badge Unlocked!</p>
                      <p className="text-teal-200/60 text-[11px] mt-1">
                        Achieved with: <span className="text-white font-medium">{habitStreaks.filter(hs => hs.streak >= selectedMilestone.days).map(hs => hs.habit.title).join(', ')}</span>
                      </p>
                    </div>
                  ) : (
                    <p className="text-teal-200/60">Reach a <span className="text-white font-semibold">{selectedMilestone.days}-day streak</span> on any habit to unlock this badge.</p>
                  )}
                </div>
                <button onClick={() => setSelectedMilestone(null)} className="w-full py-3 rounded-2xl bg-[#00f2fe]/20 hover:bg-[#00f2fe]/30 text-white font-bold text-xs border border-[#00f2fe]/30 transition-all">
                  Close
                </button>
              </div>
            </div>
          )}
        </div>
      );
    }

    // Habit Form Modal Component
    function HabitFormModal({ isOpen, onClose, onSave, initialData }) {
      if (!isOpen) return null;

      const COLORS = ['#00f2fe', '#00d8ff', '#0d9488', '#8b5cf6', '#f59e0b', '#ef4444', '#ec4899'];
      const [title, setTitle] = useState('');
      const [category, setCategory] = useState('');
      const [color, setColor] = useState(COLORS[0]);
      const [priority, setPriority] = useState('medium');
      const [categories, setCategories] = useState([]);
      const [isAddingCustom, setIsAddingCustom] = useState(false);
      const [newCatName, setNewCatName] = useState('');
      const [newCatIcon, setNewCatIcon] = useState('');

      useEffect(() => {
        const allCat = CategoryManager.getCategories();
        setCategories(allCat);
        if (initialData) {
          setTitle(initialData.title);
          setCategory(initialData.category);
          setColor(initialData.color);
          setPriority(initialData.priority || 'medium');
        } else {
          setTitle('');
          setCategory(allCat[0]?.name || 'Health');
          setColor(allCat[0]?.color || COLORS[0]);
          setPriority('medium');
        }
      }, [initialData, isOpen]);

      const handleAddCustom = () => {
        if (!newCatName.trim()) return;
        const created = CategoryManager.addCategory({ name: newCatName.trim(), icon: newCatIcon || '', color });
        setCategories(CategoryManager.getCategories());
        setCategory(created.name);
        setIsAddingCustom(false);
        setNewCatName('');
      };

      const handleSubmit = (e) => {
        e.preventDefault();
        if (!title.trim() || !category.trim()) return;
        onSave({ title: title.trim(), category: category.trim(), color, priority, frequency: 'daily' });
        onClose();
      };

      return (
        <div className="fixed inset-0 z-50 flex items-center justify-center p-4">
          <div className="absolute inset-0 bg-[#000c14]/80 backdrop-blur-md" onClick={onClose} />
          <div className="relative w-full max-w-md bg-gradient-to-b from-[#00243d] via-[#001729] to-[#000c14] rounded-3xl p-6 shadow-2xl border border-[#00f2fe]/30 animate-fade-in z-10 max-h-[90vh] overflow-y-auto">
            <div className="flex items-center justify-between mb-6">
              <h2 className="text-xl font-extrabold text-white flex items-center gap-2">
                {initialData ? 'Edit Habit' : 'New Habit'}
                <IconGeminiStar className="w-4 h-4 text-[#00f2fe]" />
              </h2>
              <button onClick={onClose} className="p-2 rounded-full hover:bg-white/10 text-teal-200 transition-colors"><IconX /></button>
            </div>

            <form onSubmit={handleSubmit} className="space-y-5">
              <div>
                <label className="block text-sm font-semibold text-teal-200/80 mb-1.5">Habit Title</label>
                <input
                  type="text"
                  value={title}
                  onChange={e => setTitle(e.target.value)}
                  placeholder="e.g., Drink 2L Water"
                  className="w-full bg-[#001220] border border-[#00f2fe]/20 rounded-2xl px-4 py-3 text-white placeholder-teal-200/30 focus:outline-none focus:border-[#00f2fe] focus:ring-1 focus:ring-[#00f2fe] transition-all"
                  required
                />
              </div>

              <div>
                <div className="flex items-center justify-between mb-2">
                  <label className="text-sm font-semibold text-teal-200/80">Category</label>
                  <button type="button" onClick={() => setIsAddingCustom(!isAddingCustom)} className="text-xs text-[#00f2fe] font-bold hover:underline">+ Custom</button>
                </div>
                <div className="flex flex-wrap gap-2 mb-2">
                  {categories.map(cat => {
                    const isSelected = category.toLowerCase() === cat.name.toLowerCase();
                    return (
                      <button
                        key={cat.id}
                        type="button"

    // Settings Modal Component
    function SettingsModal({ isOpen, onClose, data, onImport, onClear }) {
      if (!isOpen) return null;

      const handleExport = () => {
        const dataStr = JSON.stringify(data, null, 2);
        const blob = new Blob([dataStr], { type: 'application/json' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = `habit-tracker-backup-${new Date().toISOString().slice(0, 10)}.json`;
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        URL.revokeObjectURL(url);
      };

      const handleImport = (e) => {
        const file = e.target.files?.[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = (event) => {
          try {
            const imported = JSON.parse(event.target.result);
            if (imported && Array.isArray(imported.habits) && Array.isArray(imported.completions)) {
              onImport(imported);
              onClose();
            } else { alert('Invalid backup file format.'); }
          } catch (err) { alert('Failed to read backup file.'); }
        };
        reader.readAsText(file);
      };

      return (
        <div className="fixed inset-0 z-50 flex items-center justify-center p-4">
          <div className="absolute inset-0 bg-[#000c14]/80 backdrop-blur-md" onClick={onClose} />
          <div className="relative w-full max-w-md bg-gradient-to-b from-[#00243d] via-[#001729] to-[#000c14] rounded-3xl p-6 shadow-2xl border border-[#00f2fe]/30 animate-fade-in z-10">
            <div className="flex items-center justify-between mb-6">
              <h2 className="text-xl font-extrabold text-white flex items-center gap-2">
                Settings
                <IconGeminiStar className="w-4 h-4 text-[#00f2fe]" />
              </h2>
              <button onClick={onClose} className="p-2 rounded-full hover:bg-white/10 text-teal-200 transition-colors"><IconX /></button>
            </div>

            <div className="space-y-4">
              <div className="p-4 rounded-2xl bg-[#001220] border border-[#00f2fe]/20">
                <h3 className="text-white font-bold mb-1">Data Backup & Sync</h3>
                <p className="text-xs text-teal-200/60 mb-4">Export your habits and history to JSON, or restore from a previous backup file.</p>
                <div className="flex gap-3">
                  <button onClick={handleExport} className="flex-1 bg-[#00f2fe]/15 hover:bg-[#00f2fe]/25 text-[#00f2fe] border border-[#00f2fe]/30 py-3 rounded-xl font-bold text-xs transition-all">Export JSON</button>
                  <label className="flex-1 bg-[#00f2fe]/15 hover:bg-[#00f2fe]/25 text-[#00f2fe] border border-[#00f2fe]/30 py-3 rounded-xl font-bold text-xs transition-all text-center cursor-pointer">
                    Import JSON
                    <input type="file" accept=".json" className="hidden" onChange={handleImport} />
                  </label>
                </div>
              </div>

              <div className="p-4 rounded-2xl bg-rose-500/10 border border-rose-500/20">
                <h3 className="text-rose-300 font-bold mb-1">Danger Zone</h3>
                <p className="text-xs text-rose-300/70 mb-4">Permanently delete all habits and completion history.</p>
                <button onClick={() => { if (confirm('Are you sure you want to delete all data?')) { onClear(); onClose(); } }} className="w-full py-3 rounded-xl bg-rose-500/20 text-rose-300 font-bold text-xs border border-rose-500/30 hover:bg-rose-500/30 transition-all">
                  Clear All Data
                </button>
              </div>
            </div>
          </div>
        </div>
      );
    }

    // Daily Motivation Component
    function DailyMotivation() {
      const DEFAULT_QUOTES = [
        { quote: "We are what we repeatedly do. Excellence, then, is not an act, but a habit.", author: "Aristotle" },
        { quote: "Small daily improvements over time lead to stunning results.", author: "Robin Sharma" },
        { quote: "You do not rise to the level of your goals. You fall to the level of your systems.", author: "James Clear" },
        { quote: "Motivation is what gets you started. Habit is what keeps you going.", author: "Jim Ryun" },
        { quote: "The secret of your future is hidden in your daily routine.", author: "Mike Murdock" },
        { quote: "Success is the sum of small efforts, repeated day in and day out.", author: "Robert Collier" },
        { quote: "Discipline is choosing between what you want now and what you want most.", author: "Abraham Lincoln" }
      ];

      const [currentQuote, setCurrentQuote] = useState(() => {
        const dayOfYear = Math.floor((Date.now() - new Date(new Date().getFullYear(), 0, 0).getTime()) / 86400000);
        return DEFAULT_QUOTES[dayOfYear % DEFAULT_QUOTES.length];
      });
      const [isLoading, setIsLoading] = useState(false);

      const fetchNewQuote = async () => {
        setIsLoading(true);
        try {
          const controller = new AbortController();
          const tid = setTimeout(() => controller.abort(), 2000);
          const res = await fetch('https://dummyjson.com/quotes/random', { signal: controller.signal });
          clearTimeout(tid);
          if (res.ok) {
            const data = await res.json();
            if (data && data.quote && data.author) {
              setCurrentQuote({ quote: data.quote, author: data.author });
              setIsLoading(false);
              return;
            }
          }
        } catch (e) {}

        const available = DEFAULT_QUOTES.filter(q => q.quote !== currentQuote.quote);
        const next = available[Math.floor(Math.random() * available.length)] || DEFAULT_QUOTES[0];
        setCurrentQuote(next);
        setIsLoading(false);
      };

      return (
        <div className="mb-6 rounded-3xl gemini-card p-4 sm:p-5 border border-[#00f2fe]/20 shadow-xl transition-all">
          <div className="flex items-center justify-between gap-2 mb-2">
            <div className="flex items-center gap-1.5 text-[#00f2fe] text-xs font-bold uppercase tracking-wider">
              <IconGeminiStar className="w-4 h-4 text-[#00f2fe]" />
              <span>Daily Thought</span>
            </div>
            <button
              onClick={fetchNewQuote}
              disabled={isLoading}
              className="p-1.5 rounded-lg hover:bg-white/10 text-teal-200/60 hover:text-white transition-colors"
              title="Refresh quote"
            >
              <svg className="w-4 h-4" fill="none" stroke="currentColor" strokeWidth="2" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" d="M16.023 9.348h4.992v-.001M2.985 19.644v-4.992m0 0h4.992m-4.993 0 3.181 3.183a8.25 8.25 0 0 0 13.803-3.7M4.031 9.865a8.25 8.25 0 0 1 13.803-3.7l3.181 3.182m0-4.991v4.99"/></svg>
            </button>
          </div>

          <div className="pt-0.5">
            <p className="text-xs sm:text-sm text-teal-100 italic leading-relaxed font-medium">
              "{currentQuote.quote}"
            </p>
            <p className="text-[11px] text-[#00f2fe]/80 font-bold text-right mt-1.5">
              — {currentQuote.author}
            </p>
          </div>
        </div>
      );
    }

    // --- Main Standalone App ---
    function StandaloneApp() {
      const STORAGE_KEY = 'habit-tracker-data';
      const [data, setData] = useState(() => {
        try {
          const stored = localStorage.getItem(STORAGE_KEY);
          if (stored) return JSON.parse(stored);
        } catch (e) {}
        return {
          habits: [
            { id: '1', title: 'Drink Water', category: 'Health', priority: 'high', color: '#00f2fe', createdAt: Date.now() - 86400000 },
            { id: '2', title: 'Read 10 Pages', category: 'Learning', priority: 'medium', color: '#8b5cf6', createdAt: Date.now() },
          ],
          completions: [],
        };
      });

      useEffect(() => {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
      }, [data]);

      const [activeTab, setActiveTab] = useState('tasks');
      const [isFormOpen, setIsFormOpen] = useState(false);
      const [isSettingsOpen, setIsSettingsOpen] = useState(false);
      const [editingHabit, setEditingHabit] = useState(null);
      const [summarySections, setSummarySections] = useState(() => {
        try {
          const saved = localStorage.getItem('summaries_layout_config');
          if (saved) {
            const parsed = JSON.parse(saved);
            if (Array.isArray(parsed) && parsed.length > 0) return parsed;
          }
        } catch (e) {}
        return [
          { id: 'metrics', name: 'Key Metrics Overview', visible: true },
          { id: 'monthly_heatmap', name: 'Monthly Activity Overview', visible: true },
          { id: 'weekly_summary', name: 'Weekly Progress Bar', visible: true },
          { id: 'weekly_heatmap', name: 'Weekly Heatmap Grid', visible: true },
          { id: 'milestones', name: 'Milestone Badges', visible: true }
        ];
      });
      const [isEditingLayout, setIsEditingLayout] = useState(false);

      useEffect(() => {
        localStorage.setItem('summaries_layout_config', JSON.stringify(summarySections));
      }, [summarySections]);

      const toggleSectionVisibility = (id) => {
        setSummarySections(prev => prev.map(sec => sec.id === id ? { ...sec, visible: !sec.visible } : sec));
      };

      const moveSection = (index, direction) => {
        const newIndex = direction === 'up' ? index - 1 : index + 1;
        if (newIndex < 0 || newIndex >= summarySections.length) return;
        const updated = [...summarySections];
        const [moved] = updated.splice(index, 1);
        updated.splice(newIndex, 0, moved);
        setSummarySections(updated);
      };

      const resetSummaryLayout = () => {
        setSummarySections([
          { id: 'metrics', name: 'Key Metrics Overview', visible: true },
          { id: 'monthly_heatmap', name: 'Monthly Activity Overview', visible: true },
          { id: 'weekly_summary', name: 'Weekly Progress Bar', visible: true },
          { id: 'weekly_heatmap', name: 'Weekly Heatmap Grid', visible: true },
          { id: 'milestones', name: 'Milestone Badges', visible: true }
        ]);
      };
      const [activeMilestone, setActiveMilestone] = useState(null);
      const [historicalLogDate, setHistoricalLogDate] = useState(null);

      const todayStr = getTodayStr();

      const handleSaveHabit = (habitData) => {
        if (editingHabit) {
          setData(prev => ({
            ...prev,
            habits: prev.habits.map(h => h.id === editingHabit.id ? { ...h, ...habitData } : h)
          }));
        } else {
          const newHabit = { ...habitData, id: String(Date.now()), createdAt: Date.now() };
          setData(prev => ({ ...prev, habits: [...prev.habits, newHabit] }));
        }
      };

      const deleteHabit = (id) => {
        setData(prev => ({
          habits: prev.habits.filter(h => h.id !== id),
          completions: prev.completions.filter(c => c.habitId !== id)
        }));
      };

      const handleToggleCompletionForDate = (habitId, targetDate = todayStr) => {
        const wasCompleted = data.completions.some(c => c.habitId === habitId && c.date === targetDate);
        const updatedCompletions = wasCompleted
          ? data.completions.filter(c => !(c.habitId === habitId && c.date === targetDate))
          : [...data.completions, { habitId, date: targetDate }];

        setData(prev => ({ ...prev, completions: updatedCompletions }));

        if (!wasCompleted) {
          const targetHabit = data.habits.find(h => h.id === habitId);
          const newStreak = calculateStreak(habitId, updatedCompletions);
          const matched = MILESTONES.find(m => m.days === newStreak);

          if (matched && targetHabit) {
            setActiveMilestone({ milestone: matched, habitTitle: targetHabit.title });
          }

          if (targetDate === todayStr) {
            const total = data.habits.length;
            const current = data.habits.filter(h => updatedCompletions.some(c => c.habitId === h.id && c.date === todayStr)).length;
            if (current === total && total > 0 && !matched && typeof confetti === 'function') {
              confetti({ particleCount: 100, spread: 70, origin: { y: 0.6 } });
            }
          }
        }
      };

      const renderSummaryWidget = (id) => {
        switch (id) {
          case 'metrics':
            return (
              <section key="metrics" className="grid grid-cols-2 sm:grid-cols-4 gap-4">
                <div className="gemini-card rounded-2xl p-4 border border-[#00f2fe]/20 shadow-lg flex flex-col justify-between">
                  <p className="text-xs text-teal-200/60 font-semibold uppercase tracking-wider">Active Habits</p>
                  <p className="text-2xl font-extrabold text-white tracking-tight mt-1">{data.habits.length}</p>
                </div>
                <div className="gemini-card rounded-2xl p-4 border border-[#00f2fe]/20 shadow-lg flex flex-col justify-between">
                  <p className="text-xs text-teal-200/60 font-semibold uppercase tracking-wider">Total Done</p>
                  <p className="text-2xl font-extrabold text-[#00f2fe] tracking-tight mt-1">{totalCompletionsCount}</p>
                </div>
                <div className="gemini-card rounded-2xl p-4 border border-[#00f2fe]/20 shadow-lg flex flex-col justify-between">
                  <p className="text-xs text-teal-200/60 font-semibold uppercase tracking-wider">Best Streak</p>
                  <p className="text-2xl font-extrabold text-amber-300 tracking-tight mt-1">{bestStreak}d</p>
                </div>
                <div className="gemini-card rounded-2xl p-4 border border-[#00f2fe]/20 shadow-lg flex flex-col justify-between">
                  <p className="text-xs text-teal-200/60 font-semibold uppercase tracking-wider">Today's Rate</p>
                  <p className="text-2xl font-extrabold text-[#00d8ff] tracking-tight mt-1">{Math.round(progress * 100)}%</p>
                </div>
              </section>
            );
          case 'monthly_heatmap':
            return <section key="monthly_heatmap"><MonthlyHeatmap habits={data.habits} completions={data.completions} onSelectDate={(date) => setHistoricalLogDate(date)} /></section>;
          case 'weekly_summary':
            return <section key="weekly_summary"><WeeklySummary completions={data.completions} habits={data.habits} /></section>;
          case 'weekly_heatmap':
            return <section key="weekly_heatmap"><WeeklyHeatmap completions={data.completions} habits={data.habits} onSelectDate={(date) => setHistoricalLogDate(date)} /></section>;
          case 'milestones':
            return <section key="milestones"><MilestoneBadges habits={data.habits} completions={data.completions} /></section>;
          default:
            return null;
        }
      };

      const handleToggleCompletion = (habitId) => {
        handleToggleCompletionForDate(habitId, todayStr);
      };

      const reorderHabits = (newHabits) => {
        setData(prev => ({ ...prev, habits: newHabits }));
      };

      const [draggedIdx, setDraggedIdx] = useState(null);

      const handleDragStart = (e, index) => {
        setDraggedIdx(index);
        e.dataTransfer.effectAllowed = 'move';
      };

      const handleDragOver = (e, index) => {
        e.preventDefault();
        e.dataTransfer.dropEffect = 'move';
      };

      const handleDrop = (e, targetIdx) => {
        e.preventDefault();
        if (draggedIdx === null || draggedIdx === targetIdx) return;
        const updated = [...sortedHabits];
        const [moved] = updated.splice(draggedIdx, 1);
        updated.splice(targetIdx, 0, moved);
        reorderHabits(updated);
        setDraggedIdx(null);
      };

      const todayCompletions = data.habits.filter(h => data.completions.some(c => c.habitId === h.id && c.date === todayStr)).length;
      const progress = data.habits.length === 0 ? 0 : todayCompletions / data.habits.length;

      const totalCompletionsCount = data.completions.length;
      const bestStreak = useMemo(() => {
        if (data.habits.length === 0) return 0;
        return Math.max(...data.habits.map(h => calculateStreak(h.id, data.completions)), 0);
      }, [data.habits, data.completions]);

      const sortedHabits = data.habits;

      const formattedToday = new Date().toLocaleDateString('en-US', { weekday: 'long', month: 'long', day: 'numeric' });

      return (
        <div className="min-h-screen bg-[#000c14] text-teal-50 pb-32 relative overflow-hidden">
          {/* Ambient Organic Background Glows */}
          <div className="fixed top-0 left-1/2 -translate-x-1/2 w-full max-w-5xl h-96 bg-gradient-to-b from-[#00507a]/30 via-[#00203a]/20 to-transparent blur-3xl pointer-events-none -z-10 animate-gemini-glow" />

          <header className="px-6 pt-8 pb-4">
            <div className="max-w-2xl mx-auto flex items-center justify-between">
              <div>
                <p className="text-[#00f2fe] text-xs font-bold tracking-widest uppercase flex items-center gap-1.5">
                  <IconGeminiStar className="w-3.5 h-3.5 text-[#00f2fe]" />
                  <span>{formattedToday}</span>
                </p>
                <h1 className="text-2xl sm:text-3xl font-extrabold text-white tracking-tight mt-0.5 flex items-center gap-2">
                  <span className="gemini-shimmer-text">Habit Tracker</span>
                  <IconGeminiStar className="w-6 h-6 text-[#00f2fe] animate-pulse" />
                </h1>
              </div>
              <button onClick={() => setIsSettingsOpen(true)} className="w-10 h-10 rounded-2xl bg-[#001729] hover:bg-[#00243d] flex items-center justify-center text-teal-200 hover:text-white transition-all border border-[#00f2fe]/20 active:scale-95 shadow-[0_0_15px_rgba(0,242,254,0.1)]">
                <IconSettings />
              </button>
            </div>
          </header>

          <main className="max-w-2xl mx-auto px-6">
            {activeTab === 'tasks' ? (
              <div className="space-y-8 animate-fade-in">
                <DailyMotivation />

                <section>
                  <div className="flex items-center justify-between mb-5">
                    <h2 className="text-xl font-extrabold text-white tracking-tight flex items-center gap-2">

                      <IconGeminiStar className="w-4 h-4 text-[#00f2fe]" />
                    </h2>
                  </div>

                  <div className="space-y-4">
                    {data.habits.length === 0 ? (
                      <div className="text-center py-12 px-6 gemini-card rounded-3xl border border-[#00f2fe]/20 border-dashed">
                        <div className="w-16 h-16 bg-[#001a2e] rounded-full flex items-center justify-center mx-auto mb-4 text-[#00f2fe] shadow-[0_0_20px_rgba(0,242,254,0.2)]">
                          <IconGeminiStar className="w-8 h-8" />
                        </div>
                        <h3 className="text-white font-bold mb-2">No habits created yet</h3>
                        <p className="text-teal-200/60 text-sm mb-6 max-w-xs mx-auto">Start building a higher-performing routine by adding your first daily habit.</p>
                        <button onClick={() => { setEditingHabit(null); setIsFormOpen(true); }} className="inline-flex items-center gap-2 bg-gradient-to-r from-[#00f2fe] to-[#00a8ff] text-slate-950 font-extrabold px-6 py-3.5 rounded-full shadow-[0_0_20px_rgba(0,242,254,0.4)] transition-all hover:scale-105 active:scale-95">
                          <IconPlus /> Create Habit
                        </button>
                      </div>
                    ) : (

                        <HabitCard
                          key={habit.id}
                          habit={habit}
                          index={idx}
                          completions={data.completions}
                          onToggle={() => handleToggleCompletion(habit.id)}
                          onEdit={() => { setEditingHabit(habit); setIsFormOpen(true); }}
                          onDelete={() => deleteHabit(habit.id)}
                          onDragStart={handleDragStart}
                          onDragOver={handleDragOver}
                          onDrop={handleDrop}
                          isDragging={draggedIdx === idx}
                        />
                      ))
                    )}
                  </div>
                </section>

                <section className="gemini-card rounded-3xl p-6 border border-[#00f2fe]/25 shadow-2xl relative overflow-hidden flex flex-col sm:flex-row items-center gap-6">
                  <div className="flex-shrink-0">
                    <ProgressRing progress={progress} size={130} strokeWidth={12} />
                  </div>
                  <div className="text-center sm:text-left flex-1 min-w-0">

                      <IconGeminiStar className="w-3.5 h-3.5" /> Daily Focus
                    </span>

                    <p className="text-teal-200/70 text-sm leading-relaxed mb-3">
                      {data.habits.length === 0

                    {data.habits.length > 0 && (
                      <div className="w-full bg-[#001220] h-3 rounded-full overflow-hidden p-0.5 border border-[#00f2fe]/20">
                        <div className="h-full bg-gradient-to-r from-[#00f2fe] via-[#00d8ff] to-[#8b5cf6] rounded-full transition-all duration-500 shadow-[0_0_12px_rgba(0,242,254,0.5)]" style={{ width: `${Math.round(progress * 100)}%` }} />
                      </div>
                    )}
                  </div>
                </section>
              </div>
            ) : (
              <div className="space-y-8 animate-fade-in">
                <div className="flex items-center justify-between pb-2 border-b border-[#00f2fe]/15">
                  <div>
                    <h2 className="text-xl font-extrabold text-white tracking-tight flex items-center gap-2">
                      Summaries & Analytics
                      <IconGeminiStar className="w-4 h-4 text-[#00f2fe]" />
                    </h2>
                    <p className="text-xs text-teal-200/60">Personalize your reports and analytics dashboard</p>
                  </div>
                  <div className="flex items-center gap-2">
                    {isEditingLayout && (
                      <button
                        onClick={resetSummaryLayout}
                        className="text-xs font-semibold text-teal-200/60 hover:text-white px-2.5 py-1.5 rounded-xl hover:bg-white/10 transition-colors"
                      >
                        Reset
                      </button>
                    )}
                    <button
                      onClick={() => setIsEditingLayout(!isEditingLayout)}
                      className={`text-xs font-bold px-3.5 py-1.5 rounded-xl border flex items-center gap-1.5 transition-all ${
                        isEditingLayout
                          ? 'bg-[#00f2fe] text-slate-950 border-[#00f2fe] shadow-[0_0_15px_rgba(0,242,254,0.4)]'
                          : 'bg-[#001729] text-teal-100 border-[#00f2fe]/20 hover:bg-[#00243d]'
                      }`}
                    >
                      {isEditingLayout ? 'Done' : 'Edit Layout'}
                    </button>
                  </div>
                </div>

                {isEditingLayout && (
                  <div className="p-4 rounded-2xl bg-[#00f2fe]/10 border border-[#00f2fe]/30 space-y-3">
                    <div className="text-xs font-bold text-[#00f2fe] flex items-center justify-between">
                      <span>Customize Widgets & Order</span>
                      <span className="text-[10px] text-teal-200/60 font-normal">Use arrows to reorder, eye to show/hide</span>
                    </div>
                    <div className="space-y-2">
                      {summarySections.map((sec, idx) => (
                        <div
                          key={sec.id}
                          className={`flex items-center justify-between p-3 rounded-xl border transition-all ${
                            sec.visible
                              ? 'bg-[#001729] border-[#00f2fe]/20'
                              : 'bg-rose-950/20 border-rose-500/30'
                          }`}
                        >
                          <div className="flex items-center gap-2">
                            <span className="text-xs font-semibold text-teal-100">{sec.name}</span>
                            {!sec.visible && (
                              <span className="inline-flex items-center gap-1 px-2 py-0.5 rounded text-[10px] font-bold bg-rose-500/20 text-rose-300 border border-rose-500/30">
                                Hidden
                              </span>
                            )}
                          </div>
                          <div className="flex items-center gap-1">
                            <button
                              onClick={() => moveSection(idx, 'up')}
                              disabled={idx === 0}
                              className="p-1 rounded hover:bg-white/10 disabled:opacity-30 text-teal-200/60"
                            >
                              ↑
                            </button>
                            <button
                              onClick={() => moveSection(idx, 'down')}
                              disabled={idx === summarySections.length - 1}
                              className="p-1 rounded hover:bg-white/10 disabled:opacity-30 text-teal-200/60"
                            >
                              ↓
                            </button>
                            <button
                              onClick={() => toggleSectionVisibility(sec.id)}
                              className={`p-1.5 rounded transition-colors ${
                                sec.visible ? 'text-[#00f2fe] hover:bg-white/10' : 'text-rose-300 bg-rose-500/10'
                              }`}
                              title={sec.visible ? 'Hide section' : 'Show section'}
                            >
                              {sec.visible ? (
                                <svg className="w-4 h-4" fill="none" stroke="currentColor" strokeWidth="2" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" d="M2.036 12.322a1.012 1.012 0 0 1 0-.639C3.423 7.51 7.36 4.5 12 4.5c4.638 0 8.573 3.007 9.963 7.178.07.207.07.431 0 .639C20.577 16.49 16.64 19.5 12 19.5c-4.638 0-8.573-3.007-9.963-7.178Z"/><path strokeLinecap="round" strokeLinejoin="round" d="M15 12a3 3 0 1 1-6 0 3 3 0 0 1 6 0Z"/></svg>
                              ) : (
                                <svg className="w-4 h-4" fill="none" stroke="currentColor" strokeWidth="2" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" d="M3.98 8.223A10.477 10.477 0 0 0 1.934 12C3.226 16.338 7.244 19.5 12 19.5c.993 0 1.953-.138 2.863-.395M6.228 6.228A10.451 10.451 0 0 1 12 4.5c4.756 0 8.773 3.162 10.065 7.498a10.522 10.522 0 0 1-4.293 5.774M6.228 6.228 3 3m3.228 3.228 3.65 3.65m7.894 7.894L21 21m-3.228-3.228-3.65-3.65m0 0a3 3 0 1 0-4.243-4.243m4.242 4.242L9.88 9.88"/></svg>
                              )}
                            </button>
                          </div>
                        </div>
                      ))}
                    </div>
                  </div>
                )}

                <div className="space-y-8">
                  {summarySections
                    .filter(sec => sec.visible)
                    .map(sec => renderSummaryWidget(sec.id))}
                </div>
              </div>
            )}
          </main>

          {/* Gemini Dynamic Floating Pill Bottom Navigation Bar */}
          <div className="fixed bottom-6 left-1/2 -translate-x-1/2 z-50 max-w-[92vw]">
            <nav className="gemini-pill-nav p-1.5 rounded-full shadow-[0_16px_48px_rgba(0,12,20,0.8)] flex items-center gap-1.5">
              <button
                onClick={() => setActiveTab('tasks')}
                className={`flex items-center gap-2 py-2.5 px-5 rounded-full text-xs font-bold transition-all ${
                  activeTab === 'tasks' 
                    ? 'bg-gradient-to-r from-[#00f2fe]/20 to-[#00a8ff]/20 text-[#00f2fe] border border-[#00f2fe]/40 shadow-[0_0_15px_rgba(0,242,254,0.3)]' 
                    : 'text-teal-200/60 hover:text-white hover:bg-white/10'
                }`}
              >
                <IconGeminiStar className={`w-3.5 h-3.5 ${activeTab === 'tasks' ? 'text-[#00f2fe]' : 'text-teal-200/40'}`} />
                <span>Tasks</span>
                {data.habits.length > 0 && (
                  <span className={`text-[10px] px-2 py-0.5 rounded-full font-extrabold ${activeTab === 'tasks' ? 'bg-[#00f2fe]/30 text-[#00f2fe]' : 'bg-[#001729] text-teal-200/60'}`}>
                    {todayCompletions}/{data.habits.length}
                  </span>
                )}
              </button>

              <button
                onClick={() => setActiveTab('summaries')}
                className={`flex items-center gap-2 py-2.5 px-5 rounded-full text-xs font-bold transition-all ${
                  activeTab === 'summaries' 
                    ? 'bg-gradient-to-r from-[#00f2fe]/20 to-[#00a8ff]/20 text-[#00f2fe] border border-[#00f2fe]/40 shadow-[0_0_15px_rgba(0,242,254,0.3)]' 
                    : 'text-teal-200/60 hover:text-white hover:bg-white/10'
                }`}
              >
                <span>Summaries</span>
              </button>

              <div className="h-5 w-px bg-[#00f2fe]/20 mx-0.5" />

              <button
                onClick={() => { setEditingHabit(null); setIsFormOpen(true); }}
                className="flex items-center gap-1.5 bg-gradient-to-r from-[#00f2fe] to-[#00a8ff] hover:opacity-95 text-slate-950 font-extrabold text-xs px-4 py-2.5 rounded-full shadow-[0_0_20px_rgba(0,242,254,0.4)] active:scale-95 transition-all"
                title="Create new habit"
              >
                <IconPlus />
                <span className="hidden sm:inline">Add</span>
              </button>
            </nav>
          </div>

          <HabitFormModal isOpen={isFormOpen} onClose={() => setIsFormOpen(false)} onSave={handleSaveHabit} initialData={editingHabit} />
          <SettingsModal isOpen={isSettingsOpen} onClose={() => setIsSettingsOpen(false)} data={data} onImport={(imp) => setData(imp)} onClear={() => setData({ habits: [], completions: [] })} />
          <MilestoneModal isOpen={!!activeMilestone} onClose={() => setActiveMilestone(null)} milestone={activeMilestone?.milestone} habitTitle={activeMilestone?.habitTitle} />
          <HistoricalLogModal isOpen={!!historicalLogDate} dateStr={historicalLogDate} onClose={() => setHistoricalLogDate(null)} habits={data.habits} completions={data.completions} onToggleCompletion={handleToggleCompletionForDate} onSelectDate={(d) => setHistoricalLogDate(d)} />
        </div>
      );
    }

    // Only mount standalone React app when loaded directly in browser without Vite module script
    if (!window.__VITE_APP_LOADED__) {
      ReactDOM.createRoot(document.getElementById('root')).render(<StandaloneApp />);
    }
  </script>
</body>
</html>
