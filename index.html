    // --- Date Utilities ---
    function getTodayStr() {
      const now = new Date();
      return `${now.getFullYear()}-${String(now.getMonth() + 1).padStart(2, '0')}-${String(now.getDate()).padStart(2, '0')}`;
    }

    function isCompletedToday(habitId, completions) {
      const today = getTodayStr();
      return completions.some(c => c.habitId === habitId && c.date === today);
    }

    function calculateStreak(habitId, completions) {
      return getStreakStartDate(habitId, completions).streak;
    }

    function getStreakStartDate(habitId, completions) {
      const habitCompletions = new Set(
        completions.filter(c => c.habitId === habitId).map(c => c.date)
      );
      let streak = 0;
      let curr = new Date();
      let dateStr = getTodayStr();

      if (!habitCompletions.has(dateStr)) {
        curr.setDate(curr.getDate() - 1);
        dateStr = `${curr.getFullYear()}-${String(curr.getMonth() + 1).padStart(2, '0')}-${String(curr.getDate()).padStart(2, '0')}`;
      }

      let startDate = null;
      while (habitCompletions.has(dateStr)) {
        streak++;
        startDate = new Date(curr);
        curr.setDate(curr.getDate() - 1);
        dateStr = `${curr.getFullYear()}-${String(curr.getMonth() + 1).padStart(2, '0')}-${String(curr.getDate()).padStart(2, '0')}`;
      }

      let formattedStartDate = null;
      if (startDate) {
        const months = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
        formattedStartDate = `${months[startDate.getMonth()]} ${startDate.getDate()}, ${startDate.getFullYear()}`;
      }

      return { streak, startDate, formattedStartDate };
    }

    function calculateConsistencyScore(habit, completions) {
      const habitCompletions = completions.filter(c => c.habitId === habit.id);
      const uniqueCompletionDays = new Set(habitCompletions.map(c => c.date)).size;

      const today = new Date();
      const createdDate = habit.createdAt ? new Date(habit.createdAt) : today;

      const startMs = new Date(createdDate.getFullYear(), createdDate.getMonth(), createdDate.getDate()).getTime();
      const todayMs = new Date(today.getFullYear(), today.getMonth(), today.getDate()).getTime();

      const totalDays = Math.max(1, Math.floor((todayMs - startMs) / (1000 * 60 * 60 * 24)) + 1);
      return Math.min(100, Math.round((uniqueCompletionDays / totalDays) * 100));
    }

    function getWeeklyHistory(completions) {
      const days = [];
      const today = new Date();
      const currentDayOfWeek = today.getDay();
      const distanceToMonday = currentDayOfWeek === 0 ? 6 : currentDayOfWeek - 1;
      
      const monday = new Date(today);
      monday.setDate(today.getDate() - distanceToMonday);

      for (let i = 0; i < 7; i++) {
        const d = new Date(monday);
        d.setDate(monday.getDate() + i);
        const dateStr = `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
        const completedHabits = completions.filter(c => c.date === dateStr);
        days.push({ date: d, dateStr, completedHabits });
      }
      return days;
    }

    // --- Categories Manager ---
    const DEFAULT_CATEGORIES = [
      { id: 'health', name: 'Health', icon: '❤️', color: '#10b981' },
      { id: 'fitness', name: 'Fitness', icon: '🏋️', color: '#ef4444' },
      { id: 'learning', name: 'Learning', icon: '📚', color: '#8b5cf6' },
      { id: 'productivity', name: 'Productivity', icon: '⚡', color: '#0ea5e9' },
      { id: 'mindfulness', name: 'Mindfulness', icon: '🧘', color: '#ec4899' },
      { id: 'finance', name: 'Finance', icon: '💰', color: '#f59e0b' },
      { id: 'personal', name: 'Personal', icon: '👤', color: '#6366f1' },
    ];

    class CategoryManager {
      static getCategories() {
        try {
          const stored = localStorage.getItem('habit-tracker-custom-categories');
          if (stored) {
            return [...DEFAULT_CATEGORIES, ...JSON.parse(stored)];
          }
        } catch (e) {}
        return DEFAULT_CATEGORIES;
      }

      static addCategory(category) {
        const categories = this.getCategories();
        const newCat = {
          ...category,
          id: category.name.toLowerCase().replace(/\s+/g, '-'),
        };
        const existing = categories.find(c => c.name.toLowerCase() === newCat.name.toLowerCase());
        if (existing) return existing;

        const customOnly = categories.filter(c => !DEFAULT_CATEGORIES.some(d => d.id === c.id));
        customOnly.push(newCat);
        localStorage.setItem('habit-tracker-custom-categories', JSON.stringify(customOnly));
        return newCat;
      }

      static getCategoryByName(name) {
        const categories = this.getCategories();
        return categories.find(c => c.name.toLowerCase() === (name || '').toLowerCase()) || {
          id: 'other',
          name: name || 'General',
          icon: '📌',
          color: '#8b5cf6',
        };
      }
    }

    // --- Components ---

    // Progress Ring Component
    function ProgressRing({ progress, size = 140, strokeWidth = 12 }) {
      const radius = (size - strokeWidth) / 2;
      const circumference = radius * 2 * Math.PI;
      const offset = circumference - progress * circumference;

      return (
        <div className="relative flex items-center justify-center" style={{ width: size, height: size }}>
          <svg className="transform -rotate-90 w-full h-full">
            <circle cx={size / 2} cy={size / 2} r={radius} fill="none" stroke="#1c1f26" strokeWidth={strokeWidth} />
            <circle
              cx={size / 2}
              cy={size / 2}
              r={radius}
              fill="none"
              stroke="#8b5cf6"
              strokeWidth={strokeWidth}
              strokeDasharray={circumference}
              strokeDashoffset={offset}
              strokeLinecap="round"
              className="transition-all duration-700 ease-out drop-shadow-md"
            />
          </svg>
          <div className="absolute flex flex-col items-center justify-center">
            <span className="text-3xl font-bold text-white tracking-tighter">
              {Math.round(progress * 100)}%
            </span>
          </div>
        </div>
      );
    }

    // Weekly Summary Component
    function WeeklySummary({ completions, habits }) {
      const weekData = getWeeklyHistory(completions);
      const totalCompletedThisWeek = weekData.reduce((acc, day) => acc + day.completedHabits.length, 0);
      const weeklyTarget = (habits.length || 1) * 7;
      const percentage = Math.min(100, Math.round((totalCompletedThisWeek / weeklyTarget) * 100));

      return (
        <div className="bg-surface rounded-3xl p-5 border border-white/5 shadow-xl relative overflow-hidden">
          <div className="flex items-center justify-between mb-3">
            <div className="flex items-center gap-2.5">
              <div className="p-2 bg-secondary/10 text-secondary rounded-xl font-bold text-xs">
                📅
              </div>
              <div>
                <h3 className="text-white font-bold text-sm sm:text-base">Weekly Summary</h3>
                <p className="text-gray-400 text-xs">This week's progress across all habits</p>
              </div>
            </div>
            <div className="flex items-center gap-1.5 px-3 py-1.5 rounded-full bg-white/5 border border-white/5 text-xs font-semibold text-white">
              <span className="text-secondary">📈</span>
              <span>{percentage}%</span>
            </div>
          </div>

          <div className="flex items-baseline justify-between text-xs font-medium mb-2">
            <span className="text-gray-300 flex items-center gap-1">
              <span className="text-secondary">✓</span>
              <strong className="text-white font-bold text-sm">{totalCompletedThisWeek}</strong> completed
            </span>
            <span className="text-gray-400">Target: {weeklyTarget} ({habits.length} habits × 7d)</span>
          </div>

          <div className="w-full bg-[#1c1f26] h-3.5 rounded-full overflow-hidden p-0.5 border border-white/5 relative">
            <div
              className="h-full bg-gradient-to-r from-secondary to-primary rounded-full transition-all duration-700 shadow-[0_0_12px_rgba(14,165,233,0.4)]"
              style={{ width: `${percentage}%` }}
            />
          </div>
        </div>
      );
    }

    // Monthly Heatmap Component (Monthly Calendar Grid View)
    function MonthlyHeatmap({ habits, completions, onSelectDate }) {
      const [currentMonth, setCurrentMonth] = useState(new Date());
      const [hoveredDate, setHoveredDate] = useState(null);

      const year = currentMonth.getFullYear();
      const month = currentMonth.getMonth(); // 0-11

      const firstDayOfMonth = new Date(year, month, 1);
      const lastDayOfMonth = new Date(year, month + 1, 0);

      // Start on Monday (0=Mon, 6=Sun)
      let startDayOfWeek = firstDayOfMonth.getDay() - 1;
      if (startDayOfWeek === -1) startDayOfWeek = 6;

      const daysInGrid = [];

      // Leading padding days from previous month
      const prevMonthLastDay = new Date(year, month, 0).getDate();
      for (let i = startDayOfWeek - 1; i >= 0; i--) {
        const d = new Date(year, month - 1, prevMonthLastDay - i);
        daysInGrid.push({ date: d, isCurrentMonth: false });
      }

      // Days in current month
      for (let d = 1; d <= lastDayOfMonth.getDate(); d++) {
        const dateObj = new Date(year, month, d);
        daysInGrid.push({ date: dateObj, isCurrentMonth: true });
      }

      // Trailing padding days to fill 7 columns
      const remaining = 7 - (daysInGrid.length % 7);
      if (remaining < 7) {
        for (let i = 1; i <= remaining; i++) {
          const d = new Date(year, month + 1, i);
          daysInGrid.push({ date: d, isCurrentMonth: false });
        }
      }

      const dayNames = ['Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat', 'Sun'];
      const monthNames = ['January', 'February', 'March', 'April', 'May', 'June', 'July', 'August', 'September', 'October', 'November', 'December'];

      const todayStr = getTodayStr();

      const handlePrev = () => setCurrentMonth(new Date(year, month - 1, 1));
      const handleNext = () => setCurrentMonth(new Date(year, month + 1, 1));
      const handleToday = () => setCurrentMonth(new Date());

      return (
        <div className="bg-surface rounded-3xl p-5 sm:p-6 border border-white/5 shadow-xl">
          <div className="flex flex-col sm:flex-row sm:items-center justify-between gap-4 mb-6">
            <div className="flex items-center gap-3">
              <div className="p-2.5 bg-primary/10 text-primary rounded-2xl">
                📅
              </div>
              <div>
                <h3 className="text-white font-bold text-base sm:text-lg flex items-center gap-2">
                  Heatmap Calendar
                  <IconSparkles />
                </h3>
                <p className="text-gray-400 text-xs">Click any day cell to backdate or view historical completions</p>
              </div>
            </div>

            <div className="flex items-center gap-2">
              <button onClick={handlePrev} className="p-2 rounded-xl bg-[#1c1f26] hover:bg-white/10 text-gray-300 hover:text-white transition-all active:scale-95 border border-white/5" title="Previous Month">
                ◀
              </button>
              <span className="text-sm font-bold text-white min-w-[120px] text-center px-2">
                {monthNames[month]} {year}
              </span>
              <button onClick={handleNext} className="p-2 rounded-xl bg-[#1c1f26] hover:bg-white/10 text-gray-300 hover:text-white transition-all active:scale-95 border border-white/5" title="Next Month">
                ▶
              </button>

              const dateStr = `${y}-${m}-${d}`;

                      <div className="flex justify-between text-gray-300">

    // Historical Log Modal Component
    function HistoricalLogModal({ isOpen, dateStr, onClose, habits, completions, onToggleCompletion, onSelectDate }) {
      if (!isOpen || !dateStr) return null;

      const parts = dateStr.split('-');
      const parsedDate = new Date(parseInt(parts[0]), parseInt(parts[1]) - 1, parseInt(parts[2]));
      const formattedHeader = parsedDate.toLocaleDateString('en-US', { weekday: 'long', month: 'long', day: 'numeric', year: 'numeric' });
      const isToday = getTodayStr() === dateStr;

      const handlePrev = () => {
        const prev = new Date(parsedDate);
        prev.setDate(prev.getDate() - 1);
        const y = prev.getFullYear();
        const m = String(prev.getMonth() + 1).padStart(2, '0');
        const d = String(prev.getDate()).padStart(2, '0');
        onSelectDate(`${y}-${m}-${d}`);
      };

      const handleNext = () => {
        const next = new Date(parsedDate);
        next.setDate(next.getDate() + 1);
        const y = next.getFullYear();
        const m = String(next.getMonth() + 1).padStart(2, '0');
        const d = String(next.getDate()).padStart(2, '0');
        onSelectDate(`${y}-${m}-${d}`);
      };

      const handleToday = () => {
        onSelectDate(getTodayStr());
      };

      const dayCompletions = completions.filter(c => c.date === dateStr);
      const completedCount = habits.filter(h => dayCompletions.some(c => c.habitId === h.id)).length;
      const totalHabits = habits.length;
      const percentage = totalHabits === 0 ? 0 : Math.round((completedCount / totalHabits) * 100);

      return (
        <div className="fixed inset-0 z-50 flex items-center justify-center p-4">

              </button>
            </div>

            <div className="bg-primary/10 p-4 rounded-2xl border border-primary/20 mb-5 flex items-center justify-between">
              <div>
                <p className="text-xs font-medium text-gray-400">Backdated Completion Summary</p>
                <p className="text-base font-bold text-white">{completedCount} of {totalHabits} Habits Completed ({percentage}%)</p>

              <div className="w-12 h-12 rounded-2xl bg-primary text-white flex items-center justify-center font-bold text-sm shadow-md">

            <div className="flex-1 overflow-y-auto space-y-3 pr-1">

                <p className="text-center text-sm text-gray-400 py-8">No habits created yet.</p>
              ) : (
                habits.map(habit => {
                  const isCompleted = dayCompletions.some(c => c.habitId === habit.id);
                  const categoryDef = CategoryManager.getCategoryByName(habit.category);

                  return (
                    <div

                      className={`p-3.5 rounded-2xl flex items-center justify-between cursor-pointer border transition-all ${
                        isCompleted ? 'bg-primary/20 border-primary/40' : 'bg-[#1c1f26] border-white/5 hover:bg-white/5'
                      }`}
                    >
                      <div className="flex items-center gap-3 min-w-0">
                        <div
                          className={`w-9 h-9 rounded-xl flex items-center justify-center transition-all ${
                            isCompleted ? 'bg-primary text-white shadow-md shadow-primary/30' : 'bg-white/10 text-gray-400'

    // Milestone Badges Component
    function MilestoneBadges({ habits, completions }) {
      const [selectedMilestone, setSelectedMilestone] = useState(null);

      const habitStreaks = habits.map(h => ({
        habit: h,
        streak: calculateStreak(h.id, completions),
      }));

      const maxStreak = habitStreaks.reduce((max, hs) => Math.max(max, hs.streak), 0);
      const unlockedDays = new Set();
      habitStreaks.forEach(hs => {
        MILESTONES.forEach(m => {
          if (hs.streak >= m.days) unlockedDays.add(m.days);
        });
      });

      return (
        <div className="bg-surface rounded-3xl p-6 border border-white/5 shadow-xl relative">
          <div className="flex items-center justify-between mb-4">
            <div className="flex items-center gap-2">
              <div className="p-2 bg-primary/10 rounded-xl text-primary">
                <IconAward />
              </div>
              <div>
                <h3 className="text-white font-bold text-base">Streak Badges</h3>
                <p className="text-gray-400 text-xs">
                  {unlockedDays.size} of {MILESTONES.length} unlocked • Best Streak: {maxStreak}d
                </p>
              </div>
            </div>
          </div>

          <div className="grid grid-cols-3 sm:grid-cols-6 gap-3 pt-2">
            {MILESTONES.map(m => {
              const isUnlocked = unlockedDays.has(m.days);
              return (
                <button
                  key={m.days}
                  onClick={() => setSelectedMilestone(m)}
                  className={`flex flex-col items-center justify-center p-3 rounded-2xl border transition-all text-center relative focus:outline-none hover:scale-105 active:scale-95 ${
                    isUnlocked ? `${m.badgeBg} shadow-md` : 'bg-[#181a21] border-white/5 text-gray-600 opacity-60'
                  }`}
                >
                  <div className={`w-10 h-10 rounded-xl flex items-center justify-center text-xl mb-1.5 relative ${isUnlocked ? 'bg-white/10' : 'bg-white/5'}`}>
                    <span>{m.icon}</span>
                    {!isUnlocked && (
                      <div className="absolute inset-0 bg-black/40 rounded-xl flex items-center justify-center backdrop-blur-[1px]">
                        <IconLock />
                      </div>
                    )}
                  </div>
                  <span className={`text-[11px] font-bold truncate w-full ${isUnlocked ? 'text-white' : 'text-gray-500'}`}>
                    {m.title}
                  </span>
                  <span className="text-[10px] text-gray-400 font-medium">{m.days} days</span>
                </button>
              );
            })}
          </div>

          {selectedMilestone && (
            <div className="fixed inset-0 z-50 flex items-center justify-center p-4">
              <div className="absolute inset-0 bg-black/60 backdrop-blur-sm" onClick={() => setSelectedMilestone(null)} />
              <div className="relative w-full max-w-xs bg-[#1a1c23] rounded-2xl p-5 shadow-2xl border border-white/10 text-center animate-fade-in z-10">
                <div className="w-16 h-16 mx-auto rounded-2xl flex items-center justify-center text-3xl mb-3 border shadow-lg" style={{ backgroundColor: `${selectedMilestone.color}20`, borderColor: `${selectedMilestone.color}40` }}>
                  {selectedMilestone.icon}
                </div>
                <h4 className="text-lg font-bold text-white mb-1">{selectedMilestone.title}</h4>
                <p className="text-xs text-primary font-semibold mb-3">{selectedMilestone.days}-Day Streak Milestone</p>
                <div className="text-xs text-gray-300 bg-surface p-3 rounded-xl mb-4 border border-white/5">
                  {unlockedDays.has(selectedMilestone.days) ? (
                    <div>
                      <p className="text-emerald-400 font-medium">✓ Badge Unlocked!</p>
                      <p className="text-gray-400 text-[11px] mt-1">
                        Achieved with: <span className="text-white font-medium">{habitStreaks.filter(hs => hs.streak >= selectedMilestone.days).map(hs => hs.habit.title).join(', ')}</span>

                  ) : (
                    <p className="text-gray-400">Reach a <span className="text-white font-semibold">{selectedMilestone.days}-day streak</span> on any habit to unlock this badge.</p>

                <button onClick={() => setSelectedMilestone(null)} className="w-full py-2.5 rounded-xl bg-white/10 hover:bg-white/15 text-white font-medium text-xs transition-colors">
                  Close

              </div>
            </div>
          )}

      );

    // Settings Modal Component
    function SettingsModal({ isOpen, onClose, data, onImport, onClear }) {
      if (!isOpen) return null;

      const handleExport = () => {
        const dataStr = JSON.stringify(data, null, 2);
        const blob = new Blob([dataStr], { type: 'application/json' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = `habit-tracker-backup-${new Date().toISOString().slice(0, 10)}.json`;
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        URL.revokeObjectURL(url);
      };

      const handleImport = (e) => {
        const file = e.target.files?.[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = (event) => {
          try {
            const imported = JSON.parse(event.target.result);
            if (imported && Array.isArray(imported.habits) && Array.isArray(imported.completions)) {
              onImport(imported);
              onClose();
            } else { alert('Invalid backup file format.'); }
          } catch (err) { alert('Failed to read backup file.'); }
        };
        reader.readAsText(file);
      };

      return (
        <div className="fixed inset-0 z-50 flex items-center justify-center p-4">
          <div className="absolute inset-0 bg-black/60 backdrop-blur-sm" onClick={onClose} />
          <div className="relative w-full max-w-md bg-surface rounded-3xl p-6 shadow-2xl border border-white/5 animate-fade-in z-10">
            <div className="flex items-center justify-between mb-8">
              <h2 className="text-xl font-bold text-white">Settings</h2>
              <button onClick={onClose} className="p-2 rounded-full hover:bg-white/10 text-gray-400 transition-colors"><IconX /></button>
            </div>

            <div className="space-y-4">
              <div className="p-4 rounded-2xl bg-[#1c1f26] border border-white/5">
                <h3 className="text-white font-medium mb-2">Data Backup</h3>
                <p className="text-sm text-gray-400 mb-4">Export habits and history to a JSON file, or restore from a backup.</p>
                <div className="flex gap-3">
                  <button onClick={handleExport} className="flex-1 bg-white/10 hover:bg-white/15 text-white py-3 rounded-xl font-medium text-sm transition-colors">Export</button>
                  <label className="flex-1 bg-white/10 hover:bg-white/15 text-white py-3 rounded-xl font-medium text-sm transition-colors text-center cursor-pointer">
                    Import
                    <input type="file" accept=".json" className="hidden" onChange={handleImport} />
                  </label>
                </div>
              </div>

              <div className="p-4 rounded-2xl bg-red-500/10 border border-red-500/20">
                <h3 className="text-red-400 font-medium mb-2">Danger Zone</h3>
                <p className="text-sm text-red-400/80 mb-4">Permanently delete all habits and completion history.</p>
                <button onClick={() => { if (confirm('Are you sure you want to delete all data?')) { onClear(); onClose(); } }} className="w-full py-3 rounded-xl bg-red-500/20 text-red-400 font-medium text-sm hover:bg-red-500/30">
                  Clear All Data
                </button>
              </div>
            </div>
          </div>
        </div>
      );
    }

    // Daily Motivation Component
    function DailyMotivation() {
      const DEFAULT_QUOTES = [
        { quote: "We are what we repeatedly do. Excellence, then, is not an act, but a habit.", author: "Aristotle" },
        { quote: "Small daily improvements over time lead to stunning results.", author: "Robin Sharma" },
        { quote: "You do not rise to the level of your goals. You fall to the level of your systems.", author: "James Clear" },
        { quote: "Motivation is what gets you started. Habit is what keeps you going.", author: "Jim Ryun" },
        { quote: "The secret of your future is hidden in your daily routine.", author: "Mike Murdock" },
        { quote: "Success is the sum of small efforts, repeated day in and day out.", author: "Robert Collier" },
        { quote: "Discipline is choosing between what you want now and what you want most.", author: "Abraham Lincoln" }
      ];

      const [currentQuote, setCurrentQuote] = useState(() => {
        const dayOfYear = Math.floor((Date.now() - new Date(new Date().getFullYear(), 0, 0).getTime()) / 86400000);
        return DEFAULT_QUOTES[dayOfYear % DEFAULT_QUOTES.length];
      });
      const [isLoading, setIsLoading] = useState(false);

      const fetchNewQuote = async () => {
        setIsLoading(true);
        try {
          const controller = new AbortController();
          const tid = setTimeout(() => controller.abort(), 2000);
          const res = await fetch('https://dummyjson.com/quotes/random', { signal: controller.signal });
          clearTimeout(tid);
          if (res.ok) {
            const data = await res.json();
            if (data && data.quote && data.author) {
              setCurrentQuote({ quote: data.quote, author: data.author });
              setIsLoading(false);
              return;
            }
          }
        } catch (e) {}

        const available = DEFAULT_QUOTES.filter(q => q.quote !== currentQuote.quote);
        const next = available[Math.floor(Math.random() * available.length)] || DEFAULT_QUOTES[0];
        setCurrentQuote(next);
        setIsLoading(false);
      };

      return (
        <div className="mb-6 rounded-2xl bg-[#121824]/60 border border-white/5 p-4 transition-all">
          <div className="flex items-center justify-between gap-2 mb-1.5">
            <div className="flex items-center gap-1.5 text-gray-400 text-xs font-semibold uppercase tracking-wider">
              <IconSparkles />
              <span>Daily Thought</span>
            </div>
            <button
              onClick={fetchNewQuote}
              disabled={isLoading}
              className="p-1 rounded-md hover:bg-white/10 text-gray-400 hover:text-white transition-colors"
              title="Refresh quote"
            >
              🔄
            </button>
          </div>

          <div className="pt-0.5">
            <p className="text-xs sm:text-sm text-slate-300 italic leading-relaxed">
              "{currentQuote.quote}"
            </p>
            <p className="text-[11px] text-gray-500 font-medium text-right mt-1">
              — {currentQuote.author}
            </p>
          </div>
        </div>
      );
    }

    // --- Main Standalone App ---
    function StandaloneApp() {
      const STORAGE_KEY = 'habit-tracker-data';
      const [data, setData] = useState(() => {
        try {
          const stored = localStorage.getItem(STORAGE_KEY);
          if (stored) return JSON.parse(stored);
        } catch (e) {}
        return {
          habits: [
            { id: '1', title: 'Drink Water', category: 'Health', priority: 'high', color: '#0ea5e9', createdAt: Date.now() - 86400000 },
            { id: '2', title: 'Read 10 Pages', category: 'Learning', priority: 'medium', color: '#8b5cf6', createdAt: Date.now() },
          ],
          completions: [],
        };
      });

      useEffect(() => {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
      }, [data]);

      const [activeTab, setActiveTab] = useState('tasks');
      const [isFormOpen, setIsFormOpen] = useState(false);
      const [isSettingsOpen, setIsSettingsOpen] = useState(false);
      const [editingHabit, setEditingHabit] = useState(null);
      const [summarySections, setSummarySections] = useState(() => {
        try {
          const saved = localStorage.getItem('summaries_layout_config');
          if (saved) {
            const parsed = JSON.parse(saved);
            if (Array.isArray(parsed) && parsed.length > 0) return parsed;
          }
        } catch (e) {}
        return [
          { id: 'metrics', name: 'Key Metrics Overview', visible: true },
          { id: 'monthly_heatmap', name: 'Monthly Activity Overview', visible: true },
          { id: 'weekly_summary', name: 'Weekly Progress Bar', visible: true },
          { id: 'weekly_heatmap', name: 'Weekly Heatmap Grid', visible: true },
          { id: 'milestones', name: 'Milestone Badges', visible: true }
        ];
      });
      const [isEditingLayout, setIsEditingLayout] = useState(false);

      useEffect(() => {
        localStorage.setItem('summaries_layout_config', JSON.stringify(summarySections));
      }, [summarySections]);

      const toggleSectionVisibility = (id) => {
        setSummarySections(prev => prev.map(sec => sec.id === id ? { ...sec, visible: !sec.visible } : sec));
      };

      const moveSection = (index, direction) => {
        const newIndex = direction === 'up' ? index - 1 : index + 1;
        if (newIndex < 0 || newIndex >= summarySections.length) return;
        const updated = [...summarySections];
        const [moved] = updated.splice(index, 1);
        updated.splice(newIndex, 0, moved);
        setSummarySections(updated);
      };

      const resetSummaryLayout = () => {
        setSummarySections([
          { id: 'metrics', name: 'Key Metrics Overview', visible: true },
          { id: 'monthly_heatmap', name: 'Monthly Activity Overview', visible: true },
          { id: 'weekly_summary', name: 'Weekly Progress Bar', visible: true },
          { id: 'weekly_heatmap', name: 'Weekly Heatmap Grid', visible: true },
          { id: 'milestones', name: 'Milestone Badges', visible: true }
        ]);
      };
      const [activeMilestone, setActiveMilestone] = useState(null);
      const [historicalLogDate, setHistoricalLogDate] = useState(null);

      const todayStr = getTodayStr();

      const handleSaveHabit = (habitData) => {
        if (editingHabit) {
          setData(prev => ({
            ...prev,
            habits: prev.habits.map(h => h.id === editingHabit.id ? { ...h, ...habitData } : h)
          }));
        } else {
          const newHabit = { ...habitData, id: String(Date.now()), createdAt: Date.now() };
          setData(prev => ({ ...prev, habits: [...prev.habits, newHabit] }));
        }
      };

      const deleteHabit = (id) => {
        setData(prev => ({
          habits: prev.habits.filter(h => h.id !== id),
          completions: prev.completions.filter(c => c.habitId !== id)
        }));
      };

      const handleToggleCompletionForDate = (habitId, targetDate = todayStr) => {
        const wasCompleted = data.completions.some(c => c.habitId === habitId && c.date === targetDate);
        const updatedCompletions = wasCompleted
          ? data.completions.filter(c => !(c.habitId === habitId && c.date === targetDate))
          : [...data.completions, { habitId, date: targetDate }];

        setData(prev => ({ ...prev, completions: updatedCompletions }));

        if (!wasCompleted) {
          const targetHabit = data.habits.find(h => h.id === habitId);
          const newStreak = calculateStreak(habitId, updatedCompletions);
          const matched = MILESTONES.find(m => m.days === newStreak);

          if (matched && targetHabit) {
            setActiveMilestone({ milestone: matched, habitTitle: targetHabit.title });
          }

      const renderSummaryWidget = (id) => {
        switch (id) {
          case 'metrics':
            return (
              <section key="metrics" className="grid grid-cols-2 sm:grid-cols-4 gap-4">
                <div className="bg-surface rounded-2xl p-4 border border-white/5 shadow-lg flex flex-col justify-between">
                  <p className="text-xs text-gray-400 font-medium">Active Habits</p>
                  <p className="text-2xl font-bold text-white tracking-tight mt-1">{data.habits.length}</p>
                </div>
                <div className="bg-surface rounded-2xl p-4 border border-white/5 shadow-lg flex flex-col justify-between">
                  <p className="text-xs text-gray-400 font-medium">Total Done</p>
                  <p className="text-2xl font-bold text-white tracking-tight mt-1">{totalCompletionsCount}</p>
                </div>
                <div className="bg-surface rounded-2xl p-4 border border-white/5 shadow-lg flex flex-col justify-between">
                  <p className="text-xs text-gray-400 font-medium">Best Streak</p>
                  <p className="text-2xl font-bold text-white tracking-tight mt-1">{bestStreak}d</p>
                </div>
                <div className="bg-surface rounded-2xl p-4 border border-white/5 shadow-lg flex flex-col justify-between">
                  <p className="text-xs text-gray-400 font-medium">Today's Rate</p>
                  <p className="text-2xl font-bold text-white tracking-tight mt-1">{Math.round(progress * 100)}%</p>
                </div>
              </section>
            );
          case 'monthly_heatmap':
            return <section key="monthly_heatmap"><MonthlyHeatmap habits={data.habits} completions={data.completions} onSelectDate={(date) => setHistoricalLogDate(date)} /></section>;
          case 'weekly_summary':
            return <section key="weekly_summary"><WeeklySummary completions={data.completions} habits={data.habits} /></section>;
          case 'weekly_heatmap':
            return <section key="weekly_heatmap"><WeeklyHeatmap completions={data.completions} habits={data.habits} onSelectDate={(date) => setHistoricalLogDate(date)} /></section>;
          case 'milestones':
            return <section key="milestones"><MilestoneBadges habits={data.habits} completions={data.completions} /></section>;
          default:
            return null;
        }
      };
      };

      const handleToggleCompletion = (habitId) => {
        handleToggleCompletionForDate(habitId, todayStr);
      };

      const reorderHabits = (newHabits) => {
        setData(prev => ({ ...prev, habits: newHabits }));
      };

      const [draggedIdx, setDraggedIdx] = useState(null);

      const handleDragStart = (e, index) => {
        setDraggedIdx(index);
        e.dataTransfer.effectAllowed = 'move';
      };

      const handleDragOver = (e, index) => {
        e.preventDefault();
        e.dataTransfer.dropEffect = 'move';
      };

      const handleDrop = (e, targetIdx) => {
        e.preventDefault();
        if (draggedIdx === null || draggedIdx === targetIdx) return;
        const updated = [...sortedHabits];
        const [moved] = updated.splice(draggedIdx, 1);
        updated.splice(targetIdx, 0, moved);
        reorderHabits(updated);
        if (sortBy !== 'manual') setSortBy('manual');
        setDraggedIdx(null);
      };

      const todayCompletions = data.habits.filter(h => data.completions.some(c => c.habitId === h.id && c.date === todayStr)).length;
      const progress = data.habits.length === 0 ? 0 : todayCompletions / data.habits.length;

      const totalCompletionsCount = data.completions.length;
      const bestStreak = useMemo(() => {
        if (data.habits.length === 0) return 0;
        return Math.max(...data.habits.map(h => calculateStreak(h.id, data.completions)), 0);
      }, [data.habits, data.completions]);

      const sortedHabits = useMemo(() => {
        if (sortBy === 'manual') return data.habits;
        return [...data.habits].sort((a, b) => {
          if (sortBy === 'name') return a.title.localeCompare(b.title);
          if (sortBy === 'priority') {
            const priorityScore = { high: 3, medium: 2, low: 1 };
            return (priorityScore[b.priority || 'medium']) - (priorityScore[a.priority || 'medium']);
          }
          return b.createdAt - a.createdAt;
        });
      }, [data.habits, sortBy]);

      const formattedToday = new Date().toLocaleDateString('en-US', { weekday: 'long', month: 'long', day: 'numeric' });

      return (
        <div className="min-h-screen bg-[#0b0f17] text-slate-100 pb-32 relative overflow-hidden">
          {/* Subtle Ambient Wash */}
          <div className="fixed top-0 left-1/2 -translate-x-1/2 w-full max-w-4xl h-80 bg-gradient-to-b from-teal-500/10 via-cyan-500/5 to-transparent blur-3xl pointer-events-none -z-10 animate-gemini-glow" />

          <header className="px-6 pt-8 pb-4">
            <div className="max-w-2xl mx-auto flex items-center justify-between">
              <div>
                <p className="text-gray-400 text-xs font-semibold tracking-wide uppercase">{formattedToday}</p>
                <h1 className="text-2xl sm:text-3xl font-extrabold text-white tracking-tight mt-0.5 flex items-center gap-2">
                  <span>Habit Tracker</span>
                  <IconSparkles />
                </h1>
              </div>
              <button onClick={() => setIsSettingsOpen(true)} className="w-10 h-10 rounded-xl bg-[#121824] hover:bg-[#1a2333] flex items-center justify-center text-gray-300 hover:text-white transition-all border border-white/10 active:scale-95">
                <IconSettings />
              </button>
            </div>
          </header>

          <main className="max-w-2xl mx-auto px-6">
            {activeTab === 'tasks' ? (
              <div className="space-y-8 animate-fade-in">
                <DailyMotivation />

                <section>
                  <div className="flex items-center justify-between mb-6">
                    <div>
                      <h2 className="text-xl font-bold text-white tracking-tight">Today's Tasks</h2>
                    </div>
                  </div>

                  <div className="space-y-4">
                    {data.habits.length === 0 ? (
                      <div className="text-center py-12 px-6 bg-surface rounded-3xl border border-white/5 border-dashed">
                        <div className="w-16 h-16 bg-[#1c1f26] rounded-full flex items-center justify-center mx-auto mb-4 text-gray-400">✨</div>
                        <h3 className="text-white font-medium mb-2">No habits yet</h3>
                        <p className="text-gray-400 text-sm mb-6 max-w-xs mx-auto">Start building a better routine by adding your first habit today.</p>
                        <button onClick={() => { setEditingHabit(null); setIsFormOpen(true); }} className="inline-flex items-center gap-2 bg-primary text-white px-6 py-3 rounded-full font-medium hover:bg-primary/90 transition-colors">
                          <IconPlus /> Create Habit
                        </button>
                      </div>
                    ) : (
                      data.habits.map((habit, idx) => (
                        <HabitCard
                          key={habit.id}
                          habit={habit}
                          index={idx}
                          completions={data.completions}
                          onToggle={() => handleToggleCompletion(habit.id)}
                          onEdit={() => { setEditingHabit(habit); setIsFormOpen(true); }}
                          onDelete={() => deleteHabit(habit.id)}
                          onDragStart={handleDragStart}
                          onDragOver={handleDragOver}
                          onDrop={handleDrop}
                          isDragging={draggedIdx === idx}
                        />
                      ))
                    )}
                  </div>
                </section>

                <section className="bg-surface rounded-3xl p-6 border border-white/5 shadow-xl relative overflow-hidden flex flex-col sm:flex-row items-center gap-6">
                  <div className="flex-shrink-0">
                    <ProgressRing progress={progress} size={130} strokeWidth={12} />
                  </div>
                  <div className="text-center sm:text-left flex-1 min-w-0">
                    <span className="inline-flex items-center gap-1 text-xs font-semibold uppercase tracking-wider text-primary px-3 py-1 rounded-full bg-primary/10 border border-primary/20 mb-2">
                      🎯 Daily Focus
                    </span>
                    <h3 className="text-xl font-bold text-white tracking-tight mb-1">
                      {progress === 1 ? '🎉 All Tasks Complete!' : `${todayCompletions} of ${data.habits.length} Tasks Done`}
                    </h3>
                    <p className="text-gray-400 text-sm leading-relaxed mb-3">
                      {data.habits.length === 0
                        ? 'No habits created yet. Add your first task to get started!'
                        : progress === 1
                        ? 'Fantastic job! You achieved 100% of your goals for today.'
                        : `${data.habits.length - todayCompletions} remaining today. Keep building your daily momentum!`}
                    </p>
                    {data.habits.length > 0 && (
                      <div className="w-full bg-[#1c1f26] h-2.5 rounded-full overflow-hidden p-0.5 border border-white/5">
                        <div className="h-full bg-gradient-to-r from-secondary to-primary rounded-full transition-all duration-500" style={{ width: `${Math.round(progress * 100)}%` }} />
                      </div>
                    )}
                  </div>
                </section>
              </div>
            ) : (
              <div className="space-y-8 animate-fade-in">
                <div className="flex items-center justify-between pb-2 border-b border-white/5">
                  <div>
                    <h2 className="text-xl font-bold text-white tracking-tight">Summaries & Analytics</h2>
                    <p className="text-xs text-gray-400">Personalize your reports and stats layout</p>
                  </div>
                  <div className="flex items-center gap-2">
                    {isEditingLayout && (
                      <button
                        onClick={resetSummaryLayout}
                        className="text-xs font-medium text-gray-400 hover:text-white px-2.5 py-1.5 rounded-xl hover:bg-white/5 transition-colors"
                      >
                        Reset
                      </button>
                    )}
                    <button
                      onClick={() => setIsEditingLayout(!isEditingLayout)}
                      className={`text-xs font-semibold px-3 py-1.5 rounded-xl border flex items-center gap-1.5 transition-all ${
                        isEditingLayout
                          ? 'bg-primary text-white border-primary shadow-sm'
                          : 'bg-surface text-gray-300 border-white/10 hover:bg-surface-hover'
                      }`}
                    >
                      {isEditingLayout ? 'Done' : 'Edit Layout'}
                    </button>
                  </div>
                </div>

                {isEditingLayout && (
                  <div className="p-4 rounded-2xl bg-primary/5 border border-primary/20 space-y-3">
                    <div className="text-xs font-semibold text-primary flex items-center justify-between">
                      <span>Customize Widgets & Order</span>
                      <span className="text-[10px] text-gray-400 font-normal">Use arrows to reorder, eye to show/hide</span>
                    </div>
                    <div className="space-y-2">
                      {summarySections.map((sec, idx) => (
                        <div
                          key={sec.id}
                          className={`flex items-center justify-between p-3 rounded-xl bg-surface border transition-all ${
                            sec.visible ? 'border-white/10' : 'border-white/5 opacity-50'
                          }`}
                        >
                          <span className="text-xs font-medium text-gray-200">{sec.name}</span>
                          <div className="flex items-center gap-1">
                            <button
                              onClick={() => moveSection(idx, 'up')}
                              disabled={idx === 0}
                              className="p-1 rounded hover:bg-white/5 disabled:opacity-30 text-gray-400"
                            >
                              ↑
                            </button>
                            <button
                              onClick={() => moveSection(idx, 'down')}
                              disabled={idx === summarySections.length - 1}
                              className="p-1 rounded hover:bg-white/5 disabled:opacity-30 text-gray-400"
                            >
                              ↓
                            </button>
                            <button
                              onClick={() => toggleSectionVisibility(sec.id)}
                              className={`p-1 rounded transition-colors ${
                                sec.visible ? 'text-primary' : 'text-gray-500'
                              }`}
                            >
                              {sec.visible ? '👁️' : '🙈'}
                            </button>
                          </div>
                        </div>
                      ))}
                    </div>
                  </div>
                )}

                <div className="space-y-8">
                  {summarySections
                    .filter(sec => sec.visible)
                    .map(sec => renderSummaryWidget(sec.id))}
                </div>
              </div>
            )}
          </main>

          {/* Floating Pill Bottom Navigation Bar */}
          <div className="fixed bottom-6 left-1/2 -translate-x-1/2 z-50 max-w-[92vw]">
            <nav className="bg-[#121824]/95 backdrop-blur-xl border border-white/10 p-1.5 rounded-full shadow-lg flex items-center gap-1">
              <button
                onClick={() => setActiveTab('tasks')}
                className={`flex items-center gap-2 py-2 px-3.5 rounded-full text-xs font-medium transition-all ${
                  activeTab === 'tasks' ? 'bg-teal-500/15 text-cyan-300 font-semibold' : 'text-gray-400 hover:text-white hover:bg-white/5'
                }`}
              >
                <span>Tasks</span>
                {data.habits.length > 0 && (
                  <span className={`text-[10px] px-1.5 py-0.2 rounded-full font-bold ${activeTab === 'tasks' ? 'bg-teal-500/20 text-cyan-300' : 'bg-[#1c1f26] text-gray-400'}`}>
                    {todayCompletions}/{data.habits.length}
                  </span>
                )}
              </button>

              <button
                onClick={() => setActiveTab('summaries')}
                className={`flex items-center gap-2 py-2 px-3.5 rounded-full text-xs font-medium transition-all ${
                  activeTab === 'summaries' ? 'bg-teal-500/15 text-cyan-300 font-semibold' : 'text-gray-400 hover:text-white hover:bg-white/5'
                }`}
              >
                <span>Summaries</span>
              </button>

              <div className="h-4 w-px bg-white/10 mx-0.5" />

              <button
                onClick={() => { setEditingHabit(null); setIsFormOpen(true); }}
                className="flex items-center gap-1 bg-teal-600 hover:bg-teal-500 text-white font-medium text-xs px-3.5 py-2 rounded-full shadow-sm active:scale-95 transition-all"
                title="Create new habit"
              >
                <IconPlus />
                <span className="hidden sm:inline">Add</span>
              </button>
            </nav>
          </div>

          <HabitFormModal isOpen={isFormOpen} onClose={() => setIsFormOpen(false)} onSave={handleSaveHabit} initialData={editingHabit} />
          <SettingsModal isOpen={isSettingsOpen} onClose={() => setIsSettingsOpen(false)} data={data} onImport={(imp) => setData(imp)} onClear={() => setData({ habits: [], completions: [] })} />
          <MilestoneModal isOpen={!!activeMilestone} onClose={() => setActiveMilestone(null)} milestone={activeMilestone?.milestone} habitTitle={activeMilestone?.habitTitle} />
          <HistoricalLogModal isOpen={!!historicalLogDate} dateStr={historicalLogDate} onClose={() => setHistoricalLogDate(null)} habits={data.habits} completions={data.completions} onToggleCompletion={handleToggleCompletionForDate} onSelectDate={(d) => setHistoricalLogDate(d)} />
        </div>
      );
    }

    // Only mount standalone React app when loaded directly in browser without Vite module script
    if (!window.__VITE_APP_LOADED__) {
      ReactDOM.createRoot(document.getElementById('root')).render(<StandaloneApp />);
    }
  </script>
</body>
</html>
